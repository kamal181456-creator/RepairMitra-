<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepairMitra Vendor</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:12px}.top,.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px #0001}.top{display:flex;justify-content:space-between;align-items:center}.card{margin-top:15px}input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccd5e2;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 14px;background:#1769e0;color:#fff;font-weight:800;cursor:pointer}.success{background:#16834b}.danger{background:#dc2626}.secondary{background:#eef2f7;color:#172033}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #e1e7ef;border-radius:14px;padding:15px;margin-top:12px}.msg{display:none;padding:10px;border-radius:10px;margin:10px 0}.ok{display:block;background:#e7f7ee;color:#166534}.err{display:block;background:#fde8e8;color:#991b1b}.hidden{display:none!important}.muted{color:#667085}.forgot{display:block;text-align:center;margin:14px 0;color:#1769e0;text-decoration:none;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{gap:10px;flex-wrap:wrap}}</style></head><body><div class="wrap"><header class="top"><b style="font-size:20px;color:#1769e0">RepairMitra 👨‍🔧</b><button id="logout" class="btn danger" style="display:none" onclick="logout()">Logout</button></header><section id="login" class="card"><h2>Vendor Sign In</h2><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" onclick="login()">Sign In</button><a class="forgot" href="forgot-password.html?vendor=1">🔐 Forgot Password?</a><a class="btn secondary" style="display:inline-block;text-decoration:none" href="vendor_signup.html">Create Vendor Account</a><div id="loginMsg" class="msg"></div></section><main id="app" class="hidden"><section class="card"><h2>🏪 Shop Profile</h2><div id="profileMsg" class="msg"></div><div class="grid"><input id="shop" placeholder="Shop Name"><input id="owner" placeholder="Owner Name"><input id="phone" placeholder="Mobile Number"><input id="city" placeholder="City"><input id="area" placeholder="Area"><input id="pin" placeholder="PIN Code"></div><textarea id="address" placeholder="Complete Shop Address"></textarea><div class="grid"><input id="lat" placeholder="Latitude"><input id="lon" placeholder="Longitude"></div><input id="map" placeholder="Google Maps URL"><input id="services" placeholder="Services (comma separated)"><button class="btn secondary" onclick="locate()">📍 Use Current Location</button> <button class="btn success" onclick="saveProfile()">💾 Save Profile</button></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>📋 Repair Requests</h2><button class="btn secondary" onclick="loadRepairs()">Refresh</button></div><div id="list"><p class="muted">Loading...</p></div></section></main></div><script>const sb=supabase.createClient('https://rqnmshqrwntxilwnhqwa.supabase.co','sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v');let user=null;const $=id=>document.getElementById(id);function msg(id,t,ok=false){$(id).textContent=t;$(id).className='msg '+(ok?'ok':'err')}async function isVendor(id){const r=await sb.from('profiles').select('role,is_active').eq('id',id).maybeSingle();return !r.error&&r.data?.role==='vendor'&&r.data?.is_active!==false}async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(r.error)return msg('loginMsg',r.error.message);if(!(await isVendor(r.data.user.id))){await sb.auth.signOut();return msg('loginMsg','This account is not an active vendor.')}openApp(r.data.user)}async function init(){const r=await sb.auth.getSession();if(r.data.session&&await isVendor(r.data.session.user.id))openApp(r.data.session.user)}function openApp(u){user=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').style.display='inline-block';loadProfile();loadRepairs()}async function loadProfile(){const r=await sb.from('vendor_shops').select('*').eq('vendor_id',user.id).maybeSingle();if(r.data){const x=r.data;$('shop').value=x.shop_name||'';$('owner').value=x.owner_name||'';$('phone').value=x.phone||'';$('city').value=x.city||'';$('area').value=x.area||'';$('pin').value=x.pincode||'';$('address').value=x.address||'';$('lat').value=x.latitude||'';$('lon').value=x.longitude||'';$('map').value=x.map_url||'';$('services').value=Array.isArray(x.services)?x.services.join(', '):x.services||''}}function locate(){navigator.geolocation?.getCurrentPosition(p=>{$('lat').value=p.coords.latitude;$('lon').value=p.coords.longitude;$('map').value='https://www.google.com/maps?q='+p.coords.latitude+','+p.coords.longitude},()=>alert('Please allow location permission.'))}async function saveProfile(){const p={vendor_id:user.id,shop_name:$('shop').value.trim(),owner_name:$('owner').value.trim(),phone:$('phone').value.trim(),city:$('city').value.trim(),area:$('area').value.trim(),pincode:$('pin').value.trim(),address:$('address').value.trim(),latitude:parseFloat($('lat').value)||null,longitude:parseFloat($('lon').value)||null,map_url:$('map').value.trim(),services:$('services').value.split(',').map(x=>x.trim()).filter(Boolean),updated_at:new Date().toISOString()};const r=await sb.from('vendor_shops').upsert(p,{onConflict:'vendor_id'});msg('profileMsg',r.error?r.error.message:'Shop profile saved successfully.',!r.error)}async function loadRepairs(){const r=await sb.from('complaints').select('*').order('created_at',{ascending:false});if(r.error)return $('list').innerHTML='<p class="muted">'+esc(r.error.message)+'</p>';const rows=r.data||[];$('list').innerHTML=rows.length?rows.map(c=>`<div class="item"><h3>📱 ${esc(c.mobile_model||'Mobile')}</h3><p><b>Problem:</b> ${esc(c.problem||c.issue||'-')}</p><p><b>Address:</b> ${esc(c.address||'-')}</p><p><b>Status:</b> ${esc(c.marketplace_status||c.status||'New')}</p><input id="amt_${esc(c.id)}" type="number" placeholder="Quote Amount ₹"><input id="time_${esc(c.id)}" placeholder="Estimated Time"><textarea id="note_${esc(c.id)}" placeholder="Service / parts note"></textarea><button class="btn success" onclick="quote('${esc(c.id)}')">💰 Submit Quote</button></div>`).join(''):'<p class="muted">No repair requests available.</p>'}async function quote(id){const amount=Number($('amt_'+id).value);if(!amount)return alert('Enter quote amount.');const r=await sb.from('repair_quotes').upsert({complaint_id:String(id),vendor_id:user.id,quote_amount:amount,estimated_time:$('time_'+id).value.trim(),service_details:$('note_'+id).value.trim(),status:'submitted',updated_at:new Date().toISOString()},{onConflict:'complaint_id,vendor_id'});if(r.error)return alert(r.error.message);alert('Quote submitted successfully.');loadRepairs()}async function logout(){await sb.auth.signOut();location.reload()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();</script></body></html>
