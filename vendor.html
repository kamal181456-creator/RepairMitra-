<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepairMitra Vendor</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:12px}.top,.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px #0001}.top{display:flex;justify-content:space-between;align-items:center}.card{margin-top:15px}input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccd5e2;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 14px;background:#1769e0;color:#fff;font-weight:800;cursor:pointer}.success{background:#16834b}.danger{background:#dc2626}.secondary{background:#eef2f7;color:#172033}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{border:1px solid #e1e7ef;border-radius:14px;padding:15px;margin-top:12px}.msg{display:none;padding:10px;border-radius:10px;margin:10px 0}.ok{display:block;background:#e7f7ee;color:#166534}.err{display:block;background:#fde8e8;color:#991b1b}.hidden{display:none!important}.muted{color:#667085}.forgot{display:block;text-align:center;margin:14px 0;color:#1769e0;text-decoration:none;font-weight:800}.quote{background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:12px;margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{gap:10px;flex-wrap:wrap}}</style></head><body><div class="wrap"><header class="top"><b style="font-size:20px;color:#1769e0">RepairMitra 👨‍🔧</b><button id="logout" class="btn danger" style="display:none" onclick="logout()">Logout</button></header><section id="login" class="card"><h2>Vendor Sign In</h2><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" onclick="login()">Sign In</button><a class="forgot" href="forgot-password.html?vendor=1">🔐 Forgot Password?</a><a class="btn secondary" style="display:inline-block;text-decoration:none" href="vendor_signup.html">Create Vendor Account</a><div id="loginMsg" class="msg"></div></section><main id="app" class="hidden"><section class="card"><h2>🏪 Shop Profile</h2><div id="profileMsg" class="msg"></div><div class="grid"><input id="shop" placeholder="Shop Name"><input id="owner" placeholder="Owner Name"><input id="phone" placeholder="Mobile Number"><input id="city" placeholder="City"><input id="area" placeholder="Area"><input id="pin" placeholder="PIN Code"></div><textarea id="address" placeholder="Complete Shop Address"></textarea><div class="grid"><input id="lat" placeholder="Latitude"><input id="lon" placeholder="Longitude"></div><input id="map" placeholder="Google Maps URL"><input id="services" placeholder="Services (comma separated)"><button class="btn secondary" onclick="locate()">📍 Use Current Location</button> <button class="btn success" onclick="saveProfile()">💾 Save Profile</button></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>📋 Repair Requests</h2><button class="btn secondary" onclick="loadRepairs()">Refresh</button></div><p class="muted">Only open marketplace complaints are shown. You cannot see another vendor's quotations.</p><div id="list"><p class="muted">Loading...</p></div></section></main></div><script>const sb=supabase.createClient('https://rqnmshqrwntxilwnhqwa.supabase.co','sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v');let user=null;const $=id=>document.getElementById(id);function msg(id,t,ok=false){$(id).textContent=t;$(id).className='msg '+(ok?'ok':'err');$(id).style.display='block'}async function isVendor(id){const r=await sb.from('profiles').select('role,is_active').eq('id',id).maybeSingle();return !r.error&&r.data?.role==='vendor'&&r.data?.is_active!==false}async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(r.error)return msg('loginMsg',r.error.message);if(!(await isVendor(r.data.user.id))){await sb.auth.signOut();return msg('loginMsg','This account is not an active vendor.')}openApp(r.data.user)}async function init(){const r=await sb.auth.getSession();if(r.data.session&&await isVendor(r.data.session.user.id))openApp(r.data.session.user)}function openApp(u){user=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').style.display='inline-block';loadProfile();loadRepairs()}async function loadProfile(){const r=await sb.from('vendor_shops').select('*').eq('vendor_id',user.id).maybeSingle();if(r.data){const x=r.data;$('shop').value=x.shop_name||'';$('owner').value=x.owner_name||'';$('phone').value=x.phone||'';$('city').value=x.city||'';$('area').value=x.area||'';$('pin').value=x.pincode||'';$('address').value=x.address||'';$('lat').value=x.latitude||'';$('lon').value=x.longitude||'';$('map').value=x.map_url||'';$('services').value=Array.isArray(x.services)?x.services.join(', '):x.services||''}}function locate(){navigator.geolocation?.getCurrentPosition(p=>{$('lat').value=p.coords.latitude;$('lon').value=p.coords.longitude;$('map').value='https://www.google.com/maps?q='+p.coords.latitude+','+p.coords.longitude},()=>alert('Please allow location permission.'))}async function saveProfile(){const p={vendor_id:user.id,shop_name:$('shop').value.trim(),owner_name:$('owner').value.trim(),phone:$('phone').value.trim(),city:$('city').value.trim(),area:$('area').value.trim(),pincode:$('pin').value.trim(),address:$('address').value.trim(),latitude:parseFloat($('lat').value)||null,longitude:parseFloat($('lon').value)||null,map_url:$('map').value.trim(),services:$('services').value.split(',').map(x=>x.trim()).filter(Boolean),updated_at:new Date().toISOString()};const r=await sb.from('vendor_shops').upsert(p,{onConflict:'vendor_id'});msg('profileMsg',r.error?r.error.message:'Shop profile saved successfully.',!r.error)}async function loadRepairs(){const r=await sb.from('complaints').select('id,mobile_model,brand,model,problem,issue,description,address,marketplace_status,status,selected_vendor_id,created_at').order('created_at',{ascending:false});if(r.error)return $('list').innerHTML='<p class="muted">'+esc(r.error.message)+'</p>';const rows=(r.data||[]).filter(c=>['complaint_created','vendors_notified','quotes_received','customer_viewed_quotes'].includes(c.marketplace_status||'')&&!c.selected_vendor_id);if(!rows.length)return $('list').innerHTML='<p class="muted">No open repair requests available.</p>';const ids=rows.map(c=>String(c.id));const qr=await sb.from('repair_quotes').select('complaint_id,quote_amount,estimated_time,parts_details,service_details,vendor_note,status').eq('vendor_id',user.id).in('complaint_id',ids);const own=Object.fromEntries((qr.data||[]).map(q=>[String(q.complaint_id),q]));$('list').innerHTML=rows.map(c=>{const q=own[String(c.id)],disabled=q?'disabled':'';return `<div class="item"><h3>📱 ${esc(c.mobile_model||[c.brand,c.model].filter(Boolean).join(' ')||'Mobile')}</h3><p><b>Problem:</b> ${esc(c.problem||c.issue||'-')}</p><p><b>Details:</b> ${esc(c.description||'-')}</p><p><b>Address:</b> ${esc(c.address||'-')}</p><p><b>Status:</b> ${esc(c.marketplace_status||c.status||'New')}</p>${q?`<div class="quote"><b>✅ Your quotation</b><br><b>Amount:</b> ₹${esc(q.quote_amount)}<br><b>Time:</b> ${esc(q.estimated_time||'-')}<br><b>Parts:</b> ${esc(q.parts_details||'-')}<br><b>Service:</b> ${esc(q.service_details||'-')}<br><b>Message:</b> ${esc(q.vendor_note||'-')}<br><button class="btn secondary" style="margin-top:10px" onclick="editQuote('${esc(c.id)}')">✏️ Edit Quotation</button></div>`:`<div class="quote"><input id="amt_${esc(c.id)}" type="number" min="1" placeholder="Quote Amount ₹"><input id="time_${esc(c.id)}" placeholder="Estimated Time"><input id="parts_${esc(c.id)}" placeholder="Parts / spare parts details"><textarea id="service_${esc(c.id)}" placeholder="What repair/service will you do?"></textarea><textarea id="note_${esc(c.id)}" placeholder="Message to customer"></textarea><button class="btn success" onclick="quote('${esc(c.id)}')">💰 Send Quotation</button></div>`}</div>`}).join('')}async function quote(id){const amount=Number($('amt_'+id)?.value);if(!amount)return alert('Enter quote amount.');const payload={complaint_id:String(id),vendor_id:user.id,quote_amount:amount,estimated_time:$('time_'+id)?.value.trim()||'',parts_details:$('parts_'+id)?.value.trim()||'',service_details:$('service_'+id)?.value.trim()||'',vendor_note:$('note_'+id)?.value.trim()||'',status:'submitted',updated_at:new Date().toISOString()};const r=await sb.from('repair_quotes').upsert(payload,{onConflict:'complaint_id,vendor_id'});if(r.error)return alert(r.error.message);await sb.from('complaints').update({marketplace_status:'quotes_received',quotation_status:'pending',updated_at:new Date().toISOString()}).eq('id',String(id)).in('marketplace_status',['complaint_created','vendors_notified']);alert('Quotation sent to customer successfully.');loadRepairs()}async function editQuote(id){const r=await sb.from('repair_quotes').select('*').eq('complaint_id',String(id)).eq('vendor_id',user.id).maybeSingle();if(r.error||!r.data)return alert('Quotation not found.');const q=r.data;const amount=prompt('Quote Amount ₹',q.quote_amount);if(amount===null)return;const time=prompt('Estimated repair time',q.estimated_time||'');if(time===null)return;const service=prompt('Repair/service details',q.service_details||'');if(service===null)return;const parts=prompt('Parts details',q.parts_details||'');if(parts===null)return;const note=prompt('Message to customer',q.vendor_note||'');if(note===null)return;const u=await sb.from('repair_quotes').update({quote_amount:Number(amount),estimated_time:time,service_details:service,parts_details:parts,vendor_note:note,updated_at:new Date().toISOString()}).eq('id',q.id).eq('vendor_id',user.id);if(u.error)return alert(u.error.message);alert('Quotation updated.');loadRepairs()}async function logout(){await sb.auth.signOut();location.reload()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();</script></body></html>
