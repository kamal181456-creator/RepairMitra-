<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders - RepairMitra</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#172033;color:white;text-decoration:none;cursor:pointer}.card{background:white;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 4px 18px #0001}.muted{color:#667085}.status{font-weight:700;padding:7px 11px;border-radius:20px;background:#eef2ff;display:inline-block}.track{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:20px 0}.step{text-align:center;font-size:12px;color:#98a2b3}.dot{width:22px;height:22px;border-radius:50%;border:2px solid #cbd5e1;margin:0 auto 6px;background:white}.step.done{color:#172033;font-weight:700}.step.done .dot{background:#172033;border-color:#172033}.items{border-top:1px solid #eee;margin-top:14px;padding-top:10px}.item{display:flex;justify-content:space-between;padding:7px 0}.danger{color:#b42318}.empty{text-align:center;padding:50px 10px}</style></head><body><div class="wrap"><div class="top"><div><h1>My Orders</h1><div class="muted">Track your RepairMitra product orders</div></div><a class="btn" href="shop.html">Continue Shopping</a></div><div id="msg" class="card">Loading orders...</div><div id="orders"></div></div><script>const SB_URL='https://rqnmshqrwntxilwnhqwa.supabase.co';const SB_KEY='sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v';const sb=supabase.createClient(SB_URL,SB_KEY);const steps=['Pending','Confirmed','Packed','Shipped','Out for Delivery','Delivered'];function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function idx(s){if(s==='Cancelled')return -1;return steps.indexOf(s)}function track(status){if(status==='Cancelled')return '<div class="danger"><b>Order Cancelled</b></div>';let i=idx(status);return '<div class="track">'+steps.slice(0,6).map((x,n)=>'<div class="step '+(n<=i?'done':'')+'"><div class="dot"></div>'+x+'</div>').join('')+'</div>'}async function load(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='customer.html?next=my-orders.html';return}const {data:orders,error}=await sb.from('orders').select('*').eq('customer_id',user.id).order('created_at',{ascending:false});if(error){document.getElementById('msg').innerHTML='<b>Unable to load orders.</b><br>'+esc(error.message);return}document.getElementById('msg').style.display='none';if(!orders?.length){document.getElementById('orders').innerHTML='<div class="card empty"><h2>No orders yet</h2><p class="muted">Your COD orders will appear here.</p><a class="btn" href="shop.html">Shop Now</a></div>';return}let html='';for(const o of orders){const {data:items}=await sb.from('order_items').select('*, products(name,brand,image_url), product_variants(variant_name,variant_value)').eq('order_id',o.id);html+='<div class="card"><div class="top"><div><h2>Order #'+esc(String(o.id).slice(0,8).toUpperCase())+'</h2><div class="muted">'+new Date(o.created_at).toLocaleString()+'</div></div><span class="status">'+esc(o.status||'Pending')+'</span></div>'+track(o.status||'Pending')+'<div><b>Payment:</b> Cash on Delivery · '+esc(o.payment_status||'pending')+'</div><div class="items">'+(items||[]).map(it=>'<div class="item"><span>'+esc(it.products?.name||it.product_name||'Product')+(it.product_variants?' · Size '+esc(it.product_variants.variant_value):'')+' × '+esc(it.quantity)+'</span><b>₹'+Number(it.total_price||it.quantity*(it.unit_price||0)).toLocaleString('en-IN')+'</b></div>').join('')+'</div><hr><b>Total: ₹'+Number(o.total_amount||0).toLocaleString('en-IN')+'</b><p class="muted">Deliver to: '+esc(o.address)+', '+esc(o.city)+' - '+esc(o.pincode)+'</p></div>'}document.getElementById('orders').innerHTML=html}load();</script></body></html>
