<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RepairMitra</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:620px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0001}
h1{color:#1769e0}input,select,textarea,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;font-size:16px}
input,select,textarea{border:1px solid #ccd4df}textarea{min-height:90px}button{border:0;background:#1769e0;color:#fff;font-weight:bold}
.gray{background:#e9eef7;color:#172033}.msg{display:none;padding:12px;border-radius:10px;margin:10px 0}.ok{background:#e5f7ea;color:#176b36}.err{background:#fde8e8;color:#a12626}
.hidden{display:none}.small{font-size:13px;color:#667085}.item{border:1px solid #e0e5ed;border-radius:12px;padding:12px;margin:9px 0}
</style></head><body><div class="wrap">
<div class="card"><h1>RepairMitra</h1><p>📱 घर बैठे मोबाइल रिपेयरिंग सेवा</p><p id="userEmail" class="small"></p></div>

<div class="card" id="loginBox"><h2>Customer Login</h2>
<input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login करें</button><div id="loginMsg" class="msg"></div></div>

<div id="dashboard" class="hidden">
<div class="card"><h2>🛠️ नई Repair Complaint</h2>
<select id="brand"><option value="">मोबाइल ब्रांड चुनें</option><option>Samsung</option><option>Apple iPhone</option><option>Vivo</option><option>Oppo</option><option>Realme</option><option>Redmi</option><option>OnePlus</option><option>Motorola</option><option>Nothing</option><option>Other</option></select>
<input id="model" placeholder="मोबाइल मॉडल"><input id="phone" type="tel" placeholder="मोबाइल नंबर">
<select id="issue"><option value="">मोबाइल की समस्या चुनें</option><option>Display / Touch</option><option>Charging</option><option>Battery</option><option>Network / SIM</option><option>Speaker / Mic</option><option>Camera</option><option>Software / Hang</option><option>Water Damage</option><option>Other</option></select>
<textarea id="description" placeholder="समस्या के बारे में पूरी जानकारी लिखें"></textarea>
<textarea id="address" placeholder="Pickup / Service Address"></textarea>
<button id="submitBtn">Complaint Submit करें</button><div id="submitMsg" class="msg"></div></div>

<div class="card"><h2>📋 मेरी Complaints</h2><div id="complaints">Loading...</div></div>
<div class="card"><button id="logoutBtn" class="gray">Logout</button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient('https://rqnmshqrwntxilwnhqwa.supabase.co','sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v');
const $=id=>document.getElementById(id);
function msg(id,t,ok=false){const e=$(id);e.textContent=t;e.className='msg '+(ok?'ok':'err');e.style.display='block';}
function show(u){$('loginBox').classList.add('hidden');$('dashboard').classList.remove('hidden');$('userEmail').textContent='Login: '+u.email;load(u.id);}
$('loginBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('loginMsg','Email और Password भरें।');const r=await sb.auth.signInWithPassword({email,password});if(r.error)return msg('loginMsg',r.error.message);show(r.data.user);};
$('submitBtn').onclick=async()=>{const s=await sb.auth.getSession(),u=s.data.session?.user;if(!u)return msg('submitMsg','पहले Login करें।');
const brand=$('brand').value,model=$('model').value.trim(),phone=$('phone').value.trim(),issue=$('issue').value,address=$('address').value.trim();
if(!brand||!model||!phone||!issue||!address)return msg('submitMsg','Brand, Model, Phone, Problem और Address भरें।');
const b=$('submitBtn');b.disabled=true;b.textContent='Submit हो रहा है...';
const r=await sb.from('complaints').insert({customer_id:u.id,brand,model,phone,issue,address,status:'Pending'}).select().single();
b.disabled=false;b.textContent='Complaint Submit करें';if(r.error)return msg('submitMsg','Database Error: '+r.error.message);
msg('submitMsg','✅ Complaint सफलतापूर्वक दर्ज हो गई।','ok');$('brand').value='';$('model').value='';$('phone').value='';$('issue').value='';$('address').value='';load(u.id);};
async function load(uid){const r=await sb.from('complaints').select('id,brand,model,phone,issue,address,status,created_at').eq('customer_id',uid).order('created_at',{ascending:false});if(r.error){$('complaints').textContent='Load Error: '+r.error.message;return;}if(!r.data.length){$('complaints').textContent='अभी कोई complaint नहीं है।';return;}$('complaints').innerHTML=r.data.map(c=>'<div class="item"><b>'+c.brand+' - '+c.model+'</b><br>Status: '+(c.status||'Pending')+'<br>समस्या: '+c.issue+'<br>Phone: '+c.phone+'</div>').join('');}
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload();};
sb.auth.getSession().then(r=>{if(r.data.session)show(r.data.session.user);});
</script></body></html>
