<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepairMitra Admin</title><style>body{margin:0;background:#eef2f7;font-family:Arial,sans-serif}#frame{width:100%;height:100vh;border:0}#enhance{position:fixed;right:14px;bottom:14px;z-index:9999;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;box-shadow:0 5px 20px #0003}#enhance.ok{background:#16834b}</style></head><body><iframe id="frame" src="admin-unified.html?v=product-enhanced" title="RepairMitra Admin"></iframe><div id="enhance">Product tools loading…</div><script>const f=document.getElementById('frame'),badge=document.getElementById('enhance');let ready=false;function q(d,id){return d.getElementById(id)}function setv(d,id,v){const e=q(d,id);if(e&&v!==undefined&&v!==null&&String(v)!=='')e.value=v}function parseScan(raw){try{return JSON.parse(String(raw||'').trim())}catch(e){return null}}async function lookupBarcode(code){try{const r=await fetch('https://api.upcitemdb.com/prod/trial/lookup?upc='+encodeURIComponent(code));if(!r.ok)return null;const j=await r.json(),x=j?.items?.[0];return x?{name:x.title||'',brand:x.brand||'',model:x.model||'',image:x.images?.[0]||'',description:x.description||''}:null}catch(e){return null}}async function enhance(){if(ready)return;const w=f.contentWindow,d=f.contentDocument;if(!w||!d||!q(d,'pm'))return;ready=true;const old=q(d,'pimage');if(old&&!q(d,'pimagefile')){const wrap=d.createElement('div');wrap.style='display:grid;grid-template-columns:1fr 1fr;gap:8px';old.replaceWith(wrap);wrap.appendChild(old);const file=d.createElement('input');file.id='pimagefile';file.type='file';file.accept='image/*';file.capture='environment';wrap.appendChild(file);file.addEventListener('change',()=>{const x=file.files?.[0];if(!x)return;if(x.size>2*1024*1024){alert('Image must be 2 MB or smaller.');file.value='';return}const r=new FileReader();r.onload=()=>setv(d,'pimage',r.result);r.readAsDataURL(x)})}const oldOpen=w.openScanner;w.openScanner=async function(){await oldOpen?.apply(w,arguments);setTimeout(patchScanner,500)};function patchScanner(){const status=q(d,'scanStatus');if(!status)return;const marker=status.textContent;new MutationObserver(()=>{const txt=(status.textContent||'').trim();if(!txt||txt===marker||txt.includes('Allow camera')||txt.includes('Starting'))return;const m=txt.match(/(?:Scanned|Result|Code)\s*[:\-]\s*(.+)$/i),code=(m?m[1]:txt).trim();if(code.length>2)handleScan(code)}).observe(status,{childList:true,subtree:true,characterData:true})}async function handleScan(raw){const json=parseScan(raw);if(json){setv(d,'psku',json.sku||json.barcode||json.code);setv(d,'pn',json.name||json.product_name||json.title);setv(d,'pb',json.brand);setv(d,'pmodel',json.model);setv(d,'pprice',json.price||json.selling_price);setv(d,'ppurchase',json.purchase_price);setv(d,'pstock',json.stock||json.stock_quantity);setv(d,'pdesc',json.description);setv(d,'pimage',json.image||json.image_url);return}setv(d,'psku',raw);const found=await lookupBarcode(raw);if(found){setv(d,'pn',found.name);setv(d,'pb',found.brand);setv(d,'pmodel',found.model);setv(d,'pdesc',found.description);setv(d,'pimage',found.image);const s=q(d,'pmsg');if(s)s.innerHTML='<div class="msg ok">Barcode found. Review the details before saving.</div>'}else{const s=q(d,'pmsg');if(s)s.innerHTML='<div class="msg ok">Barcode saved as SKU. Enter remaining product details and save.</div>'}}badge.textContent='✓ Product image + scanner enabled';badge.classList.add('ok')}f.addEventListener('load',enhance);setInterval(enhance,800);</script></body></html>
