<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RepairMitra Admin</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;padding:20px;margin:14px 0;border-radius:18px;box-shadow:0 5px 20px #0001}
input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;font-size:16px;box-sizing:border-box}
input,select{border:1px solid #ccd4df}button{border:0;background:#1769e0;color:white;font-weight:bold}.gray{background:#e9eef7;color:#172033}
.hidden{display:none}.item{border:1px solid #dfe5ed;padding:15px;margin:12px 0;border-radius:14px}.msg{padding:12px;margin:10px 0;border-radius:10px;display:none}
.err{background:#fde8e8;color:#a12626}.small{font-size:13px;color:#667085}
</style></head><body><div class="wrap">
<div class="card"><h1>RepairMitra 🛠️</h1><p>Admin Panel</p><p id="who" class="small"></p></div>
<div class="card" id="login"><h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email"><input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button><div id="msg" class="msg err"></div></div>
<div id="panel" class="hidden"><div class="card"><h2>📋 Customer Complaints</h2><div id="list">Loading...</div></div>
<div class="card"><button class="gray" onclick="logout()">Logout</button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://rqnmshqrwntxilwnhqwa.supabase.co","sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v");
const $=x=>document.getElementById(x);
function error(t){$("msg").textContent=t;$("msg").style.display="block";}
async function login(){
 const email=$("email").value.trim(),password=$("pass").value;
 const r=await sb.auth.signInWithPassword({email,password});
 if(r.error)return error(r.error.message);
 const a=await sb.from("admins").select("id").eq("id",r.data.user.id).maybeSingle();
 if(a.error||!a.data){await sb.auth.signOut();return error("यह account Admin नहीं है।");}
 $("login").classList.add("hidden");$("panel").classList.remove("hidden");$("who").textContent="Admin: "+email;load();
}
async function load(){
 const c=await sb.from("complaints").select("id,brand,model,phone,issue,address,status,vendor_id,created_at").order("created_at",{ascending:false});
 if(c.error){$("list").textContent="Database Error: "+c.error.message;return;}
 const v=await sb.from("profiles").select("id,full_name,phone").eq("role","vendor");
 if(v.error){$("list").textContent="Vendor Error: "+v.error.message;return;}
 if(!c.data.length){$("list").textContent="अभी कोई complaint नहीं है।";return;}
 $("list").innerHTML=c.data.map(x=>`<div class="item">
<b>#${x.id} — ${x.brand} ${x.model}</b><br>Status: ${x.status||"Pending"}
<p><b>Problem:</b> ${x.issue}</p><p><b>Phone:</b> ${x.phone}</p><p><b>Address:</b> ${x.address}</p>
<select id="v${x.id}"><option value="">Vendor चुनें</option>${v.data.map(y=>`<option value="${y.id}" ${y.id===x.vendor_id?"selected":""}>${y.full_name||"Vendor"} ${y.phone||""}</option>`).join("")}</select>
<button onclick="assign(${x.id})">Vendor Assign करें</button></div>`).join("");
}
async function assign(id){
 const vendor=$("v"+id).value;if(!vendor)return alert("पहले Vendor चुनें।");
 const r=await sb.from("complaints").update({vendor_id:vendor,status:"Assigned",updated_at:new Date().toISOString()}).eq("id",id);
 if(r.error)return alert("Assign Error: "+r.error.message);
 alert("Vendor successfully assign हो गया।");load();
}
async function logout(){await sb.auth.signOut();location.reload();}
sb.auth.getSession().then(async r=>{
  const u=r.data.session?.user;
  if(!u)return;

  const a=await sb.from("admins")
    .select("id")
    .eq("id",u.id)
    .maybeSingle();

  if(!a.error && a.data){
    $("login").classList.add("hidden");
    $("panel").classList.remove("hidden");
    $("who").textContent="Admin: "+u.email;
    load();
  }
});</script></body></html>
