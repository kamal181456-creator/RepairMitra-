<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RepairMitra - Forgot Password</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:520px;margin:auto;padding:20px}.card{background:#fff;padding:24px;margin-top:30px;border-radius:18px;box-shadow:0 5px 20px #0001}h1{text-align:center}input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;font-size:16px;box-sizing:border-box}input{border:1px solid #ccd4df}button{border:0;background:#1769e0;color:#fff;font-weight:bold}.msg{display:none;padding:12px;border-radius:10px;margin-top:12px;line-height:1.5}.ok{background:#e5f7ea;color:#176b36}.err{background:#fde8e8;color:#a12626}.small{color:#667085;font-size:14px;line-height:1.5}.back{text-align:center;margin-top:14px}.back a{color:#1769e0;text-decoration:none;font-weight:bold}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>RepairMitra 🛠️</h1><h2>🔐 Password Reset</h2>
<p class="small">अपना registered Email डालें। हम आपको password बदलने का link भेजेंगे।</p>
<input id="email" type="email" placeholder="Registered Email" autocomplete="email">
<button id="btn">Reset Link भेजें</button>
<div id="msg" class="msg"></div>
<div class="back"><a href="index.html">← Login पर वापस जाएँ</a></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient("https://rqnmshqrwntxilwnhqwa.supabase.co","sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v");
const $=id=>document.getElementById(id);
function show(t,ok=false){$("msg").textContent=t;$("msg").className="msg "+(ok?"ok":"err");$("msg").style.display="block";}
$("btn").onclick=async()=>{
 const email=$("email").value.trim();
 if(!email)return show("Email डालें।");
 const b=$("btn");b.disabled=true;b.textContent="Link भेजा जा रहा है...";
 const redirect=location.origin+location.pathname.replace(/[^/]*$/,'')+'reset-password.html';
 const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirect});
 b.disabled=false;b.textContent="Reset Link भेजें";
 if(r.error)return show("Reset link भेजने में error: "+r.error.message);
 show("✅ Reset link आपके Email पर भेज दिया गया है। Email में link खोलकर नया password बनाएं।",true);
};
</script></body></html>
