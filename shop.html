<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepairMitra Shop</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:20px}.top{background:#fff;border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 4px 18px #0001}.btn{border:0;border-radius:10px;padding:10px 14px;background:#1769e0;color:#fff;text-decoration:none;font-weight:700}.card{background:#fff;border-radius:16px;padding:16px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.pic{width:100%;height:190px;object-fit:cover;border-radius:12px;background:#eee}.price{font-size:20px;font-weight:800}input,select{padding:11px;border:1px solid #ccd5e2;border-radius:10px;margin:6px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:12px}.size{padding:7px 10px;border:1px solid #ccd5e2;background:#fff;border-radius:8px;margin:3px;cursor:pointer}.size.selected{background:#1769e0;color:#fff}.cart{position:fixed;right:15px;bottom:15px;border:0;border-radius:99px;padding:15px 20px;background:#172033;color:#fff;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><b>RepairMitra 🛠️</b><div><a class="btn" href="index.html">Home</a> <a class="btn" href="my-orders.html">📦 My Orders</a></div></header><div class="card"><h1>Shop</h1><select id="cat" onchange="load()"><option value="">All Categories</option><option>New Mobile</option><option>Old Mobile</option><option>Keypad Mobile</option><option>Footwear</option><option>Accessories</option></select><input id="search" oninput="render()" placeholder="Search products..."></div><div id="products" class="grid"></div></div><button class="cart" onclick="cartOpen()">🛒 Cart (<span id="count">0</span>) · ₹<span id="sum">0</span></button><div id="modal" style="display:none;position:fixed;inset:0;background:#0008;padding:12px"><div class="card" style="max-width:650px;margin:30px auto;max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between"><h2>Cart & Checkout</h2><button onclick="modal.style.display='none'">✕</button></div><div id="cartItems"></div><h2>Total ₹<span id="total">0</span></h2><div id="form"><input id="name" placeholder="Full Name" style="width:90%"><input id="phone" placeholder="Mobile Number" style="width:90%"><input id="address" placeholder="Complete Address" style="width:90%"><input id="city" placeholder="City"><input id="pin" placeholder="PIN Code"><p>💵 <b>Cash on Delivery only</b></p><button class="btn" onclick="order()">Place COD Order</button><p id="msg"></p></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://rqnmshqrwntxilwnhqwa.supabase.co','sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v');let ps=[],vs={},cart=JSON.parse(localStorage.getItem('rm_cart')||'[]'),user=null,selected={};const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){let q=sb.from('products').select('*').eq('is_active',true);if($('cat').value)q=q.eq('category',$('cat').value);let r=await q;if(r.error){$('products').innerHTML='<div class="card">Unable to load products: '+esc(r.error.message)+'</div>';return}ps=r.data||[];let ids=ps.filter(p=>(p.category||'').toLowerCase()==='footwear').map(p=>p.id);vs={};if(ids.length){let z=await sb.from('product_variants').select('*').in('product_id',ids).eq('variant_name','Size');if(!z.error)(z.data||[]).forEach(v=>(vs[v.product_id]??=[]).push(v))}render()}function render(){let s=$('search').value.toLowerCase();let a=ps.filter(p=>((p.name||'')+' '+(p.brand||'')+' '+(p.model||'')).toLowerCase().includes(s));$('products').innerHTML=a.map(p=>{let f=(p.category||'').toLowerCase()==='footwear',name=p.name||'Product',price=Number(p.price||0),stock=Number(p.stock_quantity||0);return '<div class="card"><img class="pic" src="'+esc(p.image_url||'')+'"><span class="badge">'+esc(p.category)+'</span><h3>'+esc(name)+'</h3><p>'+esc(p.brand||'')+' '+esc(p.model||'')+'</p><div class="price">₹'+price.toLocaleString('en-IN')+'</div>'+(f&&vs[p.id]?.length?'<b>Select Size</b><div>'+vs[p.id].map(v=>'<button class="size" '+(v.stock_quantity<=0?'disabled':'')+' onclick="sel(\''+p.id+'\',\''+v.id+'\',this)">'+esc(v.variant_value)+'</button>').join('')+'</div>':'')+'<button class="btn" style="width:100%;margin-top:8px" onclick="add(\''+p.id+'\')">🛒 Add to Cart</button></div>'}).join('')}function sel(pid,vid,e){document.querySelectorAll('.size').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');selected={pid,vid}}function add(id){let p=ps.find(x=>String(x.id)===id);let f=(p.category||'').toLowerCase()==='footwear',vid=null,vname='';if(f){if(selected.pid!==id)return alert('Please select a size first.');vid=selected.vid;let v=(vs[id]||[]).find(x=>String(x.id)===vid);if(!v||v.stock_quantity<1)return alert('Size is out of stock.');vname=v.variant_value}let x=cart.find(c=>String(c.id)===id&&String(c.variant_id||'')===String(vid||''));if(x)x.qty++;else cart.push({id:String(p.id),variant_id:vid,variant_name:vname,name:p.name,price:Number(p.price||0),img:p.image_url||'',qty:1});localStorage.setItem('rm_cart',JSON.stringify(cart));selected={};count();cartOpen()}function count(){let n=cart.reduce((a,x)=>a+x.qty,0),s=cart.reduce((a,x)=>a+x.qty*x.price,0);$('count').textContent=n;$('sum').textContent=s.toLocaleString('en-IN')}function cartOpen(){$('modal').style.display='block';$('cartItems').innerHTML=cart.map((x,i)=>'<div class="card"><b>'+esc(x.name)+'</b>'+(x.variant_name?' · Size '+esc(x.variant_name):'')+'<br>₹'+x.price+' × '+x.qty+' <button onclick="cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);localStorage.setItem(\'rm_cart\',JSON.stringify(cart));cartOpen();count()">−</button> <button onclick="cart[i].qty++;localStorage.setItem(\'rm_cart\',JSON.stringify(cart));cartOpen();count()">+</button></div>').join('')||'<p>Your cart is empty.</p>';$('total').textContent=cart.reduce((a,x)=>a+x.qty*x.price,0).toLocaleString('en-IN');count()}async function order(){let g=await sb.auth.getSession();user=g.data.session?.user;if(!user){location.href='customer.html?next=shop.html';return}let name=$('name').value.trim(),phone=$('phone').value.trim(),address=$('address').value.trim(),city=$('city').value.trim(),pin=$('pin').value.trim();if(!name||!phone||!address||!city||!pin)return $('msg').textContent='Please complete all delivery details.';let r=await sb.rpc('place_store_order',{p_customer_name:name,p_phone:phone,p_address:address,p_city:city,p_pincode:pin,p_items:cart.map(x=>({product_id:x.id,variant_id:x.variant_id||null,quantity:x.qty}))});if(r.error){$('msg').textContent=r.error.message;return}cart=[];localStorage.setItem('rm_cart','[]');count();$('msg').innerHTML='Order placed successfully! <a href="my-orders.html">Track your order</a>'}sb.auth.getSession().then(x=>{user=x.data.session?.user;load()});count();</script></body></html>
