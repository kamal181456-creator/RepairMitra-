<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepairMitra Shop</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1180px;margin:auto;padding:12px}.top{background:#07111f;color:#fff;border-radius:16px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 5px 18px #0002;position:sticky;top:8px;z-index:10}.brand{font-size:21px;font-weight:900}.btn{border:0;border-radius:10px;padding:10px 14px;background:#1769e0;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.secondary{background:#eef2f7;color:#172033}.card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 4px 18px #0001}.searchbar{display:grid;grid-template-columns:1fr 220px;gap:8px}input,select{padding:12px;border:1px solid #ccd5e2;border-radius:10px;width:100%}.bannerGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.bannerLink{display:block;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px #0002}.banner{display:block;width:100%;height:auto;aspect-ratio:1200/420;object-fit:cover}.activeFilter{margin-top:12px;padding:10px 13px;border-radius:12px;background:#eaf1ff;color:#164b9b;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}.product{display:flex;flex-direction:column}.pic-wrap{width:100%;height:220px;border-radius:12px;background:#f1f4f8;display:flex;align-items:center;justify-content:center;overflow:hidden}.pic{width:100%;height:100%;object-fit:contain;object-position:center}.price{font-size:21px;font-weight:900;margin:7px 0}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;font-size:12px}.stock{font-size:13px;font-weight:700;color:#166534}.out{opacity:.65}.cart{position:fixed;right:15px;bottom:15px;border:0;border-radius:99px;padding:14px 20px;background:#172033;color:#fff;font-weight:800;z-index:20;box-shadow:0 8px 25px #0003}.modal{display:none;position:fixed;inset:0;background:#0008;padding:12px;z-index:30}.box{max-width:680px;margin:25px auto;background:#fff;border-radius:18px;padding:18px;max-height:92vh;overflow:auto}.item{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.item img{width:60px;height:60px;object-fit:contain;border-radius:8px;background:#f1f4f8}.qty button{padding:5px 10px}.msg{padding:10px;border-radius:10px;margin-top:10px}.error{background:#fff1f2;color:#9f1239}.success{background:#ecfdf3;color:#166534}@media(max-width:850px){.bannerGrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.wrap{padding:8px}.searchbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.pic-wrap{height:240px}.top{flex-wrap:wrap}.banner{aspect-ratio:1200/420}}</style></head><body><div class="wrap"><header class="top"><div class="brand">MKS TECHNOLOGY</div><div><a class="btn secondary" href="index.html">Home</a> <a class="btn secondary" href="my-orders.html">📦 My Orders</a></div></header><section class="card"><h1>🛍️ Shop</h1><div class="searchbar"><input id="search" oninput="render()" placeholder="Search products, brand, model or SKU..."><select id="cat" onchange="load()"><option value="">All Categories</option><option>New Mobile</option><option>Old Mobile</option><option>Keypad Mobile</option><option>Footwear</option><option>Accessories</option></select></div><div id="filter" class="activeFilter" style="display:none"></div></section><section class="bannerGrid"><a class="bannerLink" href="shop.html?category=New%20Mobile"><img class="banner" src="assets/android-banner.svg" alt="Android Mobile - New Mobile" loading="eager"></a><a class="bannerLink" href="shop.html?category=Keypad%20Mobile"><img class="banner" src="assets/keypad-banner.svg" alt="Keypad Mobile" loading="eager"></a><a class="bannerLink" href="shop.html?category=Footwear"><img class="banner" src="assets/footwear-banner.svg" alt="Footwear" loading="eager"></a></section><div id="message"></div><div id="products" class="grid"></div></div><button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>) · ₹<span id="sum">0</span></button><div id="modal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h2>🛒 Cart & Checkout</h2><button class="secondary" onclick="closeCart()">✕</button></div><div id="cartItems"></div><h2>Total: ₹<span id="total">0</span></h2><div id="checkout"><input id="name" placeholder="Full Name"><input id="phone" placeholder="Mobile Number"><input id="address" placeholder="Complete Address"><input id="city" placeholder="City"><input id="pin" placeholder="PIN Code"><p>💵 <b>Cash on Delivery</b></p><button id="orderBtn" class="btn" style="width:100%" onclick="placeOrder()">Place COD Order</button><div id="msg"></div></div></div></div><script>const sb=supabase.createClient('https://rqnmshqrwntxilwnhqwa.supabase.co','sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v');let ps=[],cart=JSON.parse(localStorage.getItem('rm_cart')||'[]');const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search);const requestedCategory=params.get('category')||'';if(requestedCategory){$('cat').value=requestedCategory;$('filter').style.display='block';$('filter').textContent='Showing: '+requestedCategory+' products'}function saveCart(){localStorage.setItem('rm_cart',JSON.stringify(cart));count()}function count(){let n=cart.reduce((a,x)=>a+x.qty,0),s=cart.reduce((a,x)=>a+x.qty*x.price,0);$('count').textContent=n;$('sum').textContent=s.toLocaleString('en-IN')}async function load(){let q=sb.from('products').select('*').eq('is_active',true).order('created_at',{ascending:false});const category=$('cat').value;if(category)q=q.eq('category',category);let r=await q;if(r.error){$('message').innerHTML='<div class="card msg error">Unable to load products.</div>';return}ps=r.data||[];render()}function render(){let s=$('search').value.toLowerCase();let a=ps.filter(p=>([p.name,p.brand,p.model,p.sku].join(' ').toLowerCase()).includes(s));$('products').innerHTML=a.length?a.map(p=>{let stock=Number(p.stock_quantity??p.stock??0),price=Number(p.price??p.selling_price??0),im=p.image_url||'';return '<article class="card product '+(stock<1?'out':'')+'">'+(im?'<div class="pic-wrap"><img class="pic" src="'+esc(im)+'" loading="lazy" onerror="this.parentElement.innerHTML=\'<div style=\"font-size:46px\">📦</div>\'"></div>':'<div class="pic-wrap"><div style="font-size:46px">📦</div></div>')+'<span class="badge">'+esc(p.category)+'</span><h3>'+esc(p.name)+'</h3><p>'+esc((p.brand||'')+' '+(p.model||''))+'</p><div class="price">₹'+price.toLocaleString('en-IN')+'</div><div class="stock">'+(stock>0?stock+' in stock':'Out of stock')+'</div><p>'+esc(p.description||'')+'</p>'+(stock>0?'<button class="btn" style="width:100%;margin-top:auto" onclick="add(\''+esc(p.id)+'\')">🛒 Add to Cart</button>':'<button class="secondary" style="width:100%;margin-top:auto" disabled>Out of Stock</button>')+'</article>'}).join(''):'<div class="card" style="grid-column:1/-1;text-align:center">No products found in this category.</div>'}function add(id){let p=ps.find(x=>String(x.id)===String(id));if(!p)return;let stock=Number(p.stock_quantity??p.stock??0),x=cart.find(c=>String(c.id)===String(id));if(stock<1)return alert('Out of stock.');if(x&&x.qty>=stock)return alert('Maximum available stock reached.');if(x)x.qty++;else cart.push({id:String(p.id),name:p.name,price:Number(p.price??p.selling_price??0),img:p.image_url||'',qty:1});saveCart();openCart()}function change(i,d){let x=cart[i];if(!x)return;let p=ps.find(p=>String(p.id)===String(x.id));let stock=Number(p?.stock_quantity??0);x.qty+=d;if(x.qty>stock)x.qty=stock;if(x.qty<=0)cart.splice(i,1);saveCart();openCart()}function openCart(){$('modal').style.display='block';$('cartItems').innerHTML=cart.length?cart.map((x,i)=>'<div class="item">'+(x.img?'<img src="'+esc(x.img)+'">':'')+'<div style="flex:1"><b>'+esc(x.name)+'</b><br>₹'+x.price.toLocaleString('en-IN')+' × <span class="qty"><button onclick="change('+i+',-1)">−</button> '+x.qty+' <button onclick="change('+i+',1)">+</button></span></div><b>₹'+(x.price*x.qty).toLocaleString('en-IN')+'</b></div>').join(''):'<p>Your cart is empty.</p>';$('total').textContent=cart.reduce((a,x)=>a+x.qty*x.price,0).toLocaleString('en-IN');count()}function closeCart(){$('modal').style.display='none'}async function placeOrder(){if(!cart.length)return $('msg').innerHTML='<div class="msg error">Your cart is empty.</div>';let {data:{user}}=await sb.auth.getUser();if(!user){location.href='customer.html?next=shop.html';return}let name=$('name').value.trim(),phone=$('phone').value.trim(),address=$('address').value.trim(),city=$('city').value.trim(),pin=$('pin').value.trim();if(!name||!phone||!address||!city||!pin){$('msg').innerHTML='<div class="msg error">Please complete all delivery details.</div>';return}let b=$('orderBtn');b.disabled=true;b.textContent='Placing Order...';let r=await sb.rpc('place_store_order',{p_customer_name:name,p_phone:phone,p_address:address,p_city:city,p_pincode:pin,p_items:cart.map(x=>({product_id:x.id,quantity:x.qty}))});if(r.error){$('msg').innerHTML='<div class="msg error">Order failed. Please check stock and try again.</div>';b.disabled=false;b.textContent='Place COD Order';return}let id=r.data;cart=[];saveCart();$('msg').innerHTML='<div class="msg success"><b>Order placed successfully!</b><br>Order ID: '+esc(String(id).slice(0,8).toUpperCase())+'<br><br><a href="my-orders.html">Track My Order →</a></div>';b.textContent='Order Placed';await load();setTimeout(closeCart,1200)}load();count();</script></body></html>
