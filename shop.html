<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepairMitra Shop</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1150px;margin:auto;padding:12px}.top{position:sticky;top:8px;z-index:20;background:#fff;border-radius:16px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 5px 20px #0001}.logo{font-size:20px;font-weight:900;color:#1769e0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;background:#1769e0;color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.secondary{background:#eef2f7;color:#172033}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}.card{background:#fff;border-radius:17px;padding:13px;box-shadow:0 5px 20px #0001}.pic{width:100%;height:190px;object-fit:cover;border-radius:13px;background:#eef2f7}.price{font-size:21px;font-weight:900;margin:8px 0}.muted{color:#667085;font-size:13px;line-height:1.5}.badge{display:inline-block;background:#eaf2ff;color:#1d4ed8;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800}.cart{position:fixed;right:14px;bottom:14px;z-index:30;border:0;border-radius:99px;padding:15px 19px;background:#172033;color:#fff;font-weight:900;box-shadow:0 8px 25px #0003}.drawer{position:fixed;inset:0;background:#0008;display:none;z-index:40;padding:12px}.drawer.show{display:grid;place-items:center}.box{width:min(650px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}.row{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.row img{width:65px;height:65px;object-fit:cover;border-radius:10px;background:#eef2f7}.grow{flex:1}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:10px;margin:6px 0 11px;font-size:15px}.total{font-size:23px;font-weight:900;text-align:right;margin:15px 0}.msg{padding:11px;border-radius:10px;background:#eaf8ef;color:#166534;margin:10px 0;display:none}.err{background:#fff0f0;color:#991b1b}.order{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.pic{height:170px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.pic{height:220px}}</style></head><body><div class="wrap"><header class="top"><div class="logo">RepairMitra 🛠️</div><div class="actions"><a class="btn secondary" href="index.html">Home</a><button class="btn" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button></div></header><h1>Shop</h1><div class="actions"><select id="cat" onchange="loadProducts()"><option value="">All Categories</option><option>New Mobile</option><option>Old Mobile</option><option>Keypad Mobile</option><option>Footwear</option><option>Accessories</option></select><input id="search" oninput="render()" placeholder="Search products..."></div><div id="products" class="grid"></div><div id="empty" class="card" style="display:none;text-align:center;margin-top:16px">No products available.</div></div><button class="cart" onclick="openCart()">🛒 Cart · ₹<span id="floatTotal">0</span></button><div id="drawer" class="drawer"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="drawerTitle">Cart</h2><button class="btn secondary" onclick="closeCart()">✕</button></div><div id="cartItems"></div><div class="total">Total: ₹<span id="total">0</span></div><div id="checkout"><h3>Delivery Details</h3><input id="name" placeholder="Full Name"><input id="phone" placeholder="Mobile Number"><textarea id="address" placeholder="Complete Delivery Address"></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="city" placeholder="City"><input id="pin" placeholder="PIN Code"></div><select id="payment"><option>Cash on Delivery</option><option>Online Payment</option></select><button class="btn" style="width:100%" onclick="placeOrder()">📦 Place Order</button><div id="msg" class="msg"></div></div><div id="orders" style="margin-top:18px"><h3>My Orders</h3><div id="orderList"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://rqnmshqrwntxilwnhqwa.supabase.co','sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v');let products=[],cart=JSON.parse(localStorage.getItem('rm_cart')||'[]'),user=null;const $=x=>document.getElementById(x);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadProducts(){let q=sb.from('products').select('*').order('created_at',{ascending:false});const cat=$('cat').value;if(cat)q=q.eq('category',cat);const r=await q;if(r.error){$('products').innerHTML='<div class="card">Unable to load products right now.</div>';return}products=r.data||[];render()}function render(){const s=$('search').value.toLowerCase();const a=products.filter(p=>(p.name||p.product_name||'').toLowerCase().includes(s)||(p.brand||'').toLowerCase().includes(s)||(p.category||'').toLowerCase().includes(s));$('empty').style.display=a.length?'none':'block';$('products').innerHTML=a.map(p=>{const id=String(p.id),name=p.name||p.product_name||'Product',price=Number(p.price??p.selling_price??0),stock=Number(p.stock_quantity??p.stock??p.quantity??0),img=p.image_url||p.image||'';return `<article class="card"><img class="pic" src="${esc(img)}" alt="${esc(name)}"><span class="badge">${esc(p.category||'Product')}</span><h3>${esc(name)}</h3><div class="muted">${esc(p.brand||'')} ${esc(p.model||'')}</div><div class="price">₹${price.toLocaleString('en-IN')}</div><div class="muted">${esc(p.description||'')}</div><button class="btn" style="width:100%;margin-top:9px" ${stock<=0?'disabled':''} onclick="add('${id}')">${stock>0?'🛒 Add to Cart':'Out of Stock'}</button></article>`}).join('')}function add(id){const p=products.find(x=>String(x.id)===id);if(!p)return;const stock=Number(p.stock_quantity??p.stock??p.quantity??0);const x=cart.find(x=>String(x.id)===id);if(x){if(x.qty>=stock)return alert('Maximum available stock reached.');x.qty++}else cart.push({id:String(p.id),name:p.name||p.product_name||'Product',price:Number(p.price??p.selling_price??0),img:p.image_url||p.image||'',qty:1});saveCart();openCart()}function saveCart(){localStorage.setItem('rm_cart',JSON.stringify(cart));updateCount()}function updateCount(){const n=cart.reduce((a,x)=>a+x.qty,0),t=cart.reduce((a,x)=>a+x.qty*x.price,0);$('cartCount').textContent=n;$('floatTotal').textContent=t.toLocaleString('en-IN')}function openCart(){renderCart();$('drawer').classList.add('show')}function closeCart(){$('drawer').classList.remove('show')}function renderCart(){const t=cart.reduce((a,x)=>a+x.qty*x.price,0);$('total').textContent=t.toLocaleString('en-IN');$('cartItems').innerHTML=cart.length?cart.map((x,i)=>`<div class="row"><img src="${esc(x.img)}"><div class="grow"><b>${esc(x.name)}</b><div>₹${x.price.toLocaleString('en-IN')} × ${x.qty}</div></div><button class="btn secondary" onclick="qty(${i},-1)">−</button><button class="btn secondary" onclick="qty(${i},1)">+</button><button class="btn" onclick="removeItem(${i})">✕</button></div>`).join(''):'<p class="muted">Your cart is empty.</p>';$('checkout').style.display=cart.length?'block':'none';updateCount()}function qty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);saveCart();renderCart()}function removeItem(i){cart.splice(i,1);saveCart();renderCart()}async function placeOrder(){if(!cart.length)return;const name=$('name').value.trim(),phone=$('phone').value.trim(),address=$('address').value.trim(),city=$('city').value.trim(),pin=$('pin').value.trim();if(!name||!phone||!address||!city||!pin)return showMsg('Please complete delivery details.',true);const total=cart.reduce((a,x)=>a+x.qty*x.price,0);const payload={customer_id:user?.id||null,customer_name:name,phone,address,city,pincode:pin,payment_method:$('payment').value,status:'Pending',total_amount:total,created_at:new Date().toISOString()};let r=await sb.from('orders').insert(payload).select().maybeSingle();if(r.error){localStorage.setItem('rm_pending_order',JSON.stringify({...payload,items:cart}));return showMsg('Order details saved on this device. Database order setup is required for online order tracking.',true)}const oid=r.data?.id;const items=cart.map(x=>({order_id:oid,product_id:x.id,quantity:x.qty,unit_price:x.price,total_price:x.qty*x.price}));const ir=await sb.from('order_items').insert(items);if(ir.error)console.warn(ir.error);showMsg('Order placed successfully! Order ID: '+oid,false);cart=[];saveCart();renderCart();loadOrders()}function showMsg(t,err){$('msg').textContent=t;$('msg').className='msg '+(err?'err':'');$('msg').style.display='block'}async function loadOrders(){if(!user)return;const r=await sb.from('orders').select('*').eq('customer_id',user.id).order('created_at',{ascending:false});if(r.error)return;$('orderList').innerHTML=(r.data||[]).map(o=>`<div class="order"><b>Order #${esc(o.id)}</b><br>Status: ${esc(o.status||'Pending')}<br>Total: ₹${Number(o.total_amount||0).toLocaleString('en-IN')}<br><span class="muted">${new Date(o.created_at).toLocaleString('en-IN')}</span></div>`).join('')||'<p class="muted">No orders yet.</p>'}sb.auth.getSession().then(r=>{user=r.data.session?.user||null;loadProducts();loadOrders()});updateCount();</script></body></html>
