<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP Number Sale | RepairMitra</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f8fc;color:#172033}.wrap{max-width:1100px;margin:auto;padding:14px}.nav{display:flex;justify-content:space-between;align-items:center;background:#101827;color:#fff;padding:14px 18px;border-radius:16px}.logo{font-size:20px;font-weight:900}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.gold{background:#f3c447;color:#17120a}.dark{background:#172033;color:#fff}.banner{width:100%;display:block;margin:16px 0;border-radius:20px;box-shadow:0 8px 25px #0002}.head{text-align:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;padding:18px;border-radius:16px;box-shadow:0 4px 18px #0001}.number{font-size:24px;font-weight:900;letter-spacing:2px}.price{color:#9a6900;font-size:20px;font-weight:900}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8f8ed;color:#14733b;font-size:12px;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#0009;place-items:center;padding:15px}.modal.show{display:grid}.box{background:#fff;width:min(500px,100%);border-radius:18px;padding:20px}input{width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ccd5e2;border-radius:10px}.msg{padding:10px;border-radius:10px;margin-top:8px}.ok{background:#eaf8ef;color:#166534}.err{background:#fff0f0;color:#991b1b}@media(max-width:700px){.grid{grid-template-columns:1fr}.nav{gap:10px;flex-wrap:wrap}.number{font-size:20px}}</style></head><body><div class="wrap"><header class="nav"><div class="logo">RepairMitra 🛠️</div><a class="btn gold" href="index.html">Home</a></header><img class="banner" src="assets/vip-banner.svg" alt="VIP Number Sale"><div class="head"><h1>⭐ Premium VIP Numbers</h1><p>Choose a lucky number. Book it now or request a direct sale.</p></div><div id="numbers" class="grid"></div><section class="card" style="margin-top:18px;text-align:center"><h2>Want a custom VIP number?</h2><p>Send your preferred number and we will contact you.</p><button class="btn gold" onclick="openBooking('', 'booking')">📞 Request VIP Number</button></section></div><div id="modal" class="modal"><div class="box"><h2 id="mt">Book VIP Number</h2><input id="mn" placeholder="VIP Number" readonly><input id="name" placeholder="Your Name *"><input id="phone" placeholder="Mobile Number *" inputmode="tel"><input id="offer" type="number" min="0" placeholder="Offer / agreed price (₹)"><div style="display:flex;gap:8px"><button class="btn gold" style="flex:1" onclick="submitBooking()">Submit Request</button><button class="btn dark" onclick="closeBooking()">Cancel</button></div><div id="msg"></div></div></div><script>const sb=supabase.createClient('https://rqnmshqrwntxilwnhqwa.supabase.co','sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v');let currentId=null,currentType='booking';const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function load(){const r=await sb.from('vip_numbers').select('id,phone_number,price,status').eq('status','available').order('price');if(r.error){$('numbers').innerHTML='<div class="card">Unable to load VIP numbers.</div>';return}if(!r.data.length){$('numbers').innerHTML='<div class="card" style="grid-column:1/-1;text-align:center">No VIP numbers are listed yet. Please request a custom number.</div>';return}$('numbers').innerHTML=r.data.map(x=>`<article class="card"><div class="number">${esc(x.phone_number)}</div><p class="price">₹${Number(x.price).toLocaleString('en-IN')}</p><span class="badge">For Sale</span><div style="margin-top:14px"><button class="btn gold" onclick="openBooking('${esc(x.phone_number)}','sale','${x.id}')">Buy / Book</button></div></article>`).join('')}function openBooking(n,type,id=''){currentId=id;currentType=type;$('mn').value=n;$('mt').textContent=n?(type==='sale'?'Buy / Book VIP Number':'Book VIP Number'):'Request Custom VIP Number';$('modal').classList.add('show');$('msg').innerHTML=''}function closeBooking(){$('modal').classList.remove('show')}async function submitBooking(){const name=$('name').value.trim(),phone=$('phone').value.trim(),number=$('mn').value.trim(),offer=Number($('offer').value)||null;if(name.length<2||phone.length<7)return $('msg').innerHTML='<div class="msg err">Please enter valid name and mobile number.</div>';const r=await sb.from('vip_bookings').insert({vip_number_id:currentId||null,phone_number:number||'Custom Request',customer_name:name,customer_phone:phone,booking_type:currentType,offered_price:offer});if(r.error)return $('msg').innerHTML='<div class="msg err">Request failed. Please try again.</div>';$('msg').innerHTML='<div class="msg ok">Request submitted successfully. We will contact you shortly.</div>';$('name').value='';$('phone').value='';$('offer').value='';setTimeout(closeBooking,1600)}load();</script></body></html>
