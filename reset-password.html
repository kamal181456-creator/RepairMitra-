<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RepairMitra - नया Password</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}
.wrap{max-width:520px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:22px;margin-top:30px;box-shadow:0 5px 20px #0001}
h1{color:#1769e0}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;font-size:16px;box-sizing:border-box}
input{border:1px solid #ccd4df}
button{border:0;background:#1769e0;color:#fff;font-weight:bold}
button:disabled{opacity:.6}
.msg{display:none;padding:12px;border-radius:10px;margin-top:10px}
.ok{background:#e5f7ea;color:#176b36}
.err{background:#fde8e8;color:#a12626}
</style>
</head>

<body>
<div class="wrap">
<div class="card">

<h1>RepairMitra 🔐</h1>
<h2>नया Password बनाएं</h2>

<p id="info">
Password reset link से इस page पर आने के बाद नया password बनाएं।
</p>

<input id="p1" type="password" placeholder="नया Password">
<input id="p2" type="password" placeholder="Password दोबारा डालें">

<button id="btn">Password बदलें</button>

<div id="msg" class="msg"></div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const sb = window.supabase.createClient(
  "https://rqnmshqrwntxilwnhqwa.supabase.co",
  "sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v",
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

const $ = id => document.getElementById(id);

function show(text, ok=false) {
  $("msg").textContent = text;
  $("msg").className = "msg " + (ok ? "ok" : "err");
  $("msg").style.display = "block";
}

let recoveryReady = false;

async function checkRecovery() {

  const { data } = await sb.auth.getSession();

  if (data.session) {
    recoveryReady = true;
    $("info").textContent =
      "Recovery session मिल गया। अब नया password बनाएं।";
    return;
  }

  setTimeout(async () => {

    const again = await sb.auth.getSession();

    if (again.data.session) {
      recoveryReady = true;
      $("info").textContent =
        "Recovery session मिल गया। अब नया password बनाएं।";
    } else {
      show(
        "यह page सीधे खोलने से password reset नहीं होगा। Gmail के नए recovery email में Reset Password दबाकर यहाँ आएँ।"
      );
    }

  }, 1000);
}

sb.auth.onAuthStateChange(async (event, session) => {

  if (event === "PASSWORD_RECOVERY" && session) {

    recoveryReady = true;

    $("info").textContent =
      "Recovery session मिल गया। अब नया password बनाएं।";

    $("msg").style.display = "none";
  }

});

$("btn").onclick = async () => {

  if (!recoveryReady) {
    await checkRecovery();

    if (!recoveryReady) return;
  }

  const p1 = $("p1").value;
  const p2 = $("p2").value;

  if (!p1 || !p2)
    return show("दोनों password भरें।");

  if (p1.length < 6)
    return show("Password कम से कम 6 characters का रखें।");

  if (p1 !== p2)
    return show("दोनों password एक जैसे नहीं हैं।");

  $("btn").disabled = true;
  $("btn").textContent = "Password बदल रहा है...";

  const r = await sb.auth.updateUser({
    password: p1
  });

  $("btn").disabled = false;
  $("btn").textContent = "Password बदलें";

  if (r.error)
    return show("Password बदलने में error: " + r.error.message);

  show(
    "✅ Password सफलतापूर्वक बदल गया। अब Admin Panel में Login करें।",
    true
  );

  setTimeout(() => {
    location.href = "RepairMitra_admin_panel.html";
  }, 1500);
};

checkRecovery();
</script>

</body>
</html>
