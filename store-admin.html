<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepairMitra Store Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1150px;margin:auto;padding:15px}.top,.card{background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:17px;box-shadow:0 6px 22px #0001;margin-bottom:15px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:10px;padding:11px 14px;background:#1769e0;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#eef2f7;color:#172033}.danger{background:#dc2626}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd5e2;border-radius:10px;margin:5px 0 11px}table{width:100%;border-collapse:collapse;min-width:800px}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee;font-size:13px}th{background:#f8fafc}.scroll{overflow:auto}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:15px;place-items:center}.modal.show{display:grid}.box{background:#fff;width:min(680px,100%);max-height:94vh;overflow:auto;border-radius:18px;padding:18px}.msg{padding:10px;border-radius:10px;margin:8px 0;display:none}.ok{background:#e8f8ee;color:#166534}.err{background:#fff0f0;color:#991b1b}.preview{width:100%;height:210px;object-fit:contain;background:#f1f4f8;border-radius:12px;margin-bottom:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>🛍️ Store Admin</h1><div>Real product & order management</div></div><div><button class="btn secondary" onclick="location.href='admin.html'">Admin Dashboard</button><button class="btn" onclick="openProduct()">➕ Add Product</button></div></div><div class="card"><h2>Products</h2><div class="scroll"><table><thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h2>Orders</h2><div class="scroll"><table><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Total</th><th>Payment</th><th>Status</th><th>Update</th></tr></thead><tbody id="orders"></tbody></table></div></div></div><div id="modal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between"><h2 id="mt">Add Product</h2><button class="btn secondary" onclick="closeProduct()">✕</button></div><input id="name" placeholder="Product Name"><div class="grid"><select id="category"><option>New Mobile</option><option>Old Mobile</option><option>Keypad Mobile</option><option>Footwear</option><option>Accessories</option></select><input id="brand" placeholder="Brand"></div><div class="grid"><input id="model" placeholder="Model"><input id="sku" placeholder="SKU"></div><div class="grid"><input id="price" type="number" min="0" placeholder="Selling Price"><input id="purchase" type="number" min="0" placeholder="Purchase Price"></div><div class="grid"><input id="stock" type="number" min="0" placeholder="Stock Quantity"><input id="low" type="number" min="0" value="5" placeholder="Low Stock Limit"></div><label><b>Product Image</b></label><input id="file" type="file" accept="image/*" onchange="previewImage()"><img id="preview" class="preview" style="display:none"><input id="image" placeholder="Or paste image URL"><textarea id="desc" placeholder="Description"></textarea><input type="hidden" id="id"><button class="btn" style="width:100%" onclick="saveProduct()">Save Product</button><div id="msg" class="msg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://rqnmshqrwntxilwnhqwa.supabase.co','sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v');let products=[],file=null;const $=x=>document.getElementById(x);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function message(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err');$('msg').style.display='block'}async function guard(){const s=await sb.auth.getSession();if(!s.data.session){location.href='admin.html';return false}const p=await sb.from('profiles').select('role,is_active').eq('id',s.data.session.user.id).maybeSingle();if(!p.data||p.data.role!=='admin'||p.data.is_active===false){await sb.auth.signOut();location.href='admin.html';return false}return true}async function load(){if(!await guard())return;const r=await sb.from('products').select('*').order('created_at',{ascending:false});if(r.error){$('rows').innerHTML='<tr><td colspan="6">'+esc(r.error.message)+'</td></tr>';return}products=r.data||[];$('rows').innerHTML=products.map(p=>`<tr><td>${p.image_url?`<img src="${esc(p.image_url)}" style="width:55px;height:55px;object-fit:cover;border-radius:8px">`:'—'}</td><td><b>${esc(p.name)}</b><br>${esc(p.brand||'')} ${esc(p.model||'')}</td><td>${esc(p.category)}</td><td>₹${Number(p.price).toLocaleString('en-IN')}</td><td>${p.stock_quantity}</td><td><button class="btn secondary" onclick="editProduct('${p.id}')">Edit</button> <button class="btn danger" onclick="deleteProduct('${p.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">No products yet.</td></tr>';loadOrders()}function openProduct(){['name','brand','model','sku','price','purchase','stock','desc','image'].forEach(x=>$(x).value='');$('category').selectedIndex=0;$('low').value=5;$('id').value='';$('file').value='';$('preview').style.display='none';$('mt').textContent='➕ Add Product';$('msg').style.display='none';$('modal').classList.add('show')}function closeProduct(){$('modal').classList.remove('show')}function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;openProduct();$('mt').textContent='✏️ Edit Product';$('id').value=p.id;$('name').value=p.name||'';$('category').value=p.category||'New Mobile';$('brand').value=p.brand||'';$('model').value=p.model||'';$('sku').value=p.sku||'';$('price').value=p.price||0;$('purchase').value=p.purchase_price||0;$('stock').value=p.stock_quantity||0;$('low').value=p.low_stock_limit??5;$('desc').value=p.description||'';$('image').value=p.image_url||'';if(p.image_url){$('preview').src=p.image_url;$('preview').style.display='block'}}function previewImage(){file=$('file').files[0];if(!file)return;const u=URL.createObjectURL(file);$('preview').src=u;$('preview').style.display='block'}async function saveProduct(){const name=$('name').value.trim(),price=Number($('price').value),stock=Number($('stock').value);if(!name||price<0||stock<0)return message('Enter product name, price and stock.');let image=$('image').value.trim();if(file){const ext=file.name.split('.').pop().toLowerCase();const path=crypto.randomUUID()+'.'+ext;const up=await sb.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(up.error)return message('Image upload failed: '+up.error.message);image=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}const data={name,category:$('category').value,brand:$('brand').value.trim(),model:$('model').value.trim(),sku:$('sku').value.trim()||null,price,purchase_price:Number($('purchase').value)||0,stock_quantity:stock,low_stock_limit:Number($('low').value)||0,image_url:image||null,description:$('desc').value.trim(),is_active:true,updated_at:new Date().toISOString()};let r;if($('id').value)r=await sb.from('products').update(data).eq('id',$('id').value);else r=await sb.from('products').insert(data);if(r.error)return message(r.error.message);closeProduct();file=null;load()}async function deleteProduct(id){if(!confirm('Delete this product?'))return;const r=await sb.from('products').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}async function loadOrders(){const r=await sb.from('orders').select('*').order('created_at',{ascending:false});if(r.error){$('orders').innerHTML='<tr><td colspan="7">Order table is not ready. Run ecommerce_schema.sql first.</td></tr>';return}$('orders').innerHTML=(r.data||[]).map(o=>`<tr><td>#${esc(o.id)}</td><td>${esc(o.customer_name)}</td><td>${esc(o.phone)}</td><td>₹${Number(o.total_amount).toLocaleString('en-IN')}</td><td>${esc(o.payment_method)}<br>${esc(o.payment_status||'pending')}</td><td>${esc(o.status)}</td><td><select onchange="updateOrder('${o.id}',this.value)"><option>Pending</option><option>Confirmed</option><option>Packed</option><option>Shipped</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option></select></td></tr>`).join('')||'<tr><td colspan="7">No orders yet.</td></tr>'}async function updateOrder(id,status){const r=await sb.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else loadOrders()}load();</script></body></html>
