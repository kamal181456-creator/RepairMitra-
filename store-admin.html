<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepairMitra Store Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:16px}.top,.card{background:#fff;border:1px solid #e4e8ef;border-radius:18px;padding:17px;box-shadow:0 6px 22px #0001;margin-bottom:15px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#1769e0;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#eef2f7;color:#172033}.danger{background:#dc2626}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5e2;border-radius:10px;margin:5px 0 10px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:13px}th{background:#f8fafc}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:15px;place-items:center}.modal.show{display:grid}.box{background:#fff;width:min(720px,100%);max-height:94vh;overflow:auto;border-radius:18px;padding:18px}.msg{padding:10px;border-radius:10px;margin:8px 0;display:none}.ok{background:#e8f8ee;color:#166534}.err{background:#fff0f0;color:#991b1b}.preview{width:100%;height:210px;object-fit:contain;background:#f1f4f8;border-radius:12px}.variant{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin:5px 0}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.variant{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="top"><div><h1>🛍️ Store Admin</h1><div>Products, footwear sizes, stock and COD orders</div></div><div><button class="btn secondary" onclick="location.href='admin.html'">Admin Dashboard</button><button class="btn" onclick="openProduct()">➕ Add Product</button></div></div><div class="card"><h2>Products</h2><input id="search" placeholder="Search products..." oninput="renderProducts()"><div class="scroll"><table><thead><tr><th>Image</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Sizes</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h2>📦 Orders</h2><div class="scroll"><table><thead><tr><th>Order</th><th>Customer</th><th>Delivery</th><th>Total</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody id="orders"></tbody></table></div></div></div>
<div id="modal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="mt">Add Product</h2><button class="btn secondary" onclick="closeProduct()">✕</button></div><input id="name" placeholder="Product Name *"><div class="grid"><select id="category" onchange="toggleVariants()"><option>New Mobile</option><option>Old Mobile</option><option>Keypad Mobile</option><option>Footwear</option><option>Accessories</option></select><input id="brand" placeholder="Brand"></div><div class="grid"><input id="model" placeholder="Model"><input id="sku" placeholder="SKU"></div><div class="grid"><input id="price" type="number" min="0" placeholder="Selling Price *"><input id="purchase" type="number" min="0" placeholder="Purchase Price"></div><div id="normalStock"><input id="stock" type="number" min="0" placeholder="Product Stock *"><input id="low" type="number" min="0" value="5" placeholder="Low Stock Limit"></div><div id="footStock" class="hidden"><b>Footwear Size Stock</b><div class="muted">Add each size and its separate stock.</div><div id="variants"></div><button class="btn secondary" type="button" onclick="addVariant()">＋ Add Size</button></div><br><label><b>Product Image</b></label><input id="file" type="file" accept="image/*" onchange="previewImage()"><img id="preview" class="preview hidden"><input id="image" placeholder="Or paste image URL"><textarea id="desc" placeholder="Description"></textarea><input type="hidden" id="id"><button class="btn" style="width:100%" onclick="saveProduct()">Publish Product</button><div id="msg" class="msg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://rqnmshqrwntxilwnhqwa.supabase.co','sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v');let products=[],variants=[],file=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function guard(){const s=await sb.auth.getSession();if(!s.data.session){location.href='admin.html';return false}const p=await sb.from('profiles').select('role,is_active').eq('id',s.data.session.user.id).maybeSingle();if(!p.data||p.data.role!=='admin'||p.data.is_active===false){await sb.auth.signOut();location.href='admin.html';return false}return true}
async function load(){if(!await guard())return;const p=await sb.from('products').select('*').order('created_at',{ascending:false});if(p.error)return $('rows').innerHTML='<tr><td colspan="7">'+esc(p.error.message)+'</td></tr>';products=p.data||[];const ids=products.filter(x=>x.category==='Footwear').map(x=>x.id);if(ids.length){const v=await sb.from('product_variants').select('*').in('product_id',ids);variants=v.error?[]:(v.data||[])}renderProducts();loadOrders()}
function renderProducts(){const q=$('search').value.toLowerCase();const list=products.filter(p=>`${p.name} ${p.brand||''} ${p.model||''} ${p.sku||''}`.toLowerCase().includes(q));$('rows').innerHTML=list.map(p=>{const vs=variants.filter(v=>String(v.product_id)===String(p.id));const st=p.category==='Footwear'?vs.reduce((a,v)=>a+Number(v.stock_quantity),0):Number(p.stock_quantity||0);return `<tr><td>${p.image_url?`<img src="${esc(p.image_url)}" style="width:55px;height:55px;object-fit:contain">`:'—'}</td><td><b>${esc(p.name)}</b><br><small>${esc(p.brand||'')} ${esc(p.model||'')}</small></td><td>${esc(p.category)}</td><td>₹${Number(p.price||0).toLocaleString('en-IN')}</td><td>${st}</td><td>${p.category==='Footwear'?vs.map(v=>esc(v.variant_value)+': '+v.stock_quantity).join(', ')||'—':'Product stock'}</td><td><button class="btn secondary" onclick="editProduct('${p.id}')">Edit</button> <button class="btn danger" onclick="deleteProduct('${p.id}')">Delete</button></td></tr>`}).join('')||'<tr><td colspan="7">No products.</td></tr>'}
function openProduct(){['name','brand','model','sku','price','purchase','stock','image','desc','id'].forEach(x=>$(x).value='');$('category').value='New Mobile';$('low').value=5;$('file').value='';$('preview').classList.add('hidden');$('variants').innerHTML='';$('mt').textContent='➕ Add Product';$('msg').style.display='none';file=null;toggleVariants();$('modal').classList.add('show')}function closeProduct(){$('modal').classList.remove('show')}function toggleVariants(){const f=$('category').value==='Footwear';$('footStock').classList.toggle('hidden',!f);$('normalStock').classList.toggle('hidden',f)}function addVariant(value='',stock=0){const d=document.createElement('div');d.className='variant';d.innerHTML=`<input class="vname" value="Size" readonly><input class="vvalue" placeholder="Size e.g. 6" value="${esc(value)}"><input class="vstock" type="number" min="0" placeholder="Stock" value="${stock}"><button class="btn danger" type="button" onclick="this.parentElement.remove()">✕</button>`;$('variants').appendChild(d)}
async function editProduct(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;openProduct();$('mt').textContent='✏️ Edit Product';$('id').value=p.id;$('name').value=p.name||'';$('category').value=p.category||'New Mobile';$('brand').value=p.brand||'';$('model').value=p.model||'';$('sku').value=p.sku||'';$('price').value=p.price||0;$('purchase').value=p.purchase_price||0;$('stock').value=p.stock_quantity||0;$('low').value=p.low_stock_limit??5;$('image').value=p.image_url||'';$('desc').value=p.description||'';toggleVariants();if(p.image_url){$('preview').src=p.image_url;$('preview').classList.remove('hidden')}if(p.category==='Footwear'){variants.filter(v=>String(v.product_id)===String(p.id)).forEach(v=>addVariant(v.variant_value,v.stock_quantity));}}
function previewImage(){file=$('file').files[0];if(file){$('preview').src=URL.createObjectURL(file);$('preview').classList.remove('hidden')}}
async function saveProduct(){const name=$('name').value.trim(),price=Number($('price').value);if(!name||price<0)return msg('Enter product name and valid price.');let image=$('image').value.trim();if(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=crypto.randomUUID()+'.'+ext;const u=await sb.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(u.error)return msg('Image upload failed: '+u.error.message);image=sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}const footwear=$('category').value==='Footwear';const rows=[...document.querySelectorAll('.variant')].map(x=>({variant_name:'Size',variant_value:x.querySelector('.vvalue').value.trim(),stock_quantity:Number(x.querySelector('.vstock').value||0)}));if(footwear&&(!rows.length||rows.some(x=>!x.variant_value||x.stock_quantity<0)))return msg('Add valid footwear sizes and stock.');const data={name,category:$('category').value,brand:$('brand').value.trim(),model:$('model').value.trim(),sku:$('sku').value.trim()||null,price,purchase_price:Number($('purchase').value)||0,stock_quantity:footwear?0:Number($('stock').value||0),low_stock_limit:Number($('low').value)||0,image_url:image||null,description:$('desc').value.trim(),is_active:true,updated_at:new Date().toISOString()};let r;if($('id').value)r=await sb.from('products').update(data).eq('id',$('id').value);else r=await sb.from('products').insert(data).select('id').single();if(r.error)return msg(r.error.message);const pid=$('id').value||r.data.id;if(footwear){await sb.from('product_variants').delete().eq('product_id',pid);const ins=await sb.from('product_variants').insert(rows.map(x=>({...x,product_id:pid})));if(ins.error)return msg('Size save failed: '+ins.error.message)}closeProduct();load()}function msg(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err');$('msg').style.display='block'}async function deleteProduct(id){if(!confirm('Delete this product?'))return;const r=await sb.from('products').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}
async function loadOrders(){const r=await sb.from('orders').select('*').order('created_at',{ascending:false});if(r.error)return $('orders').innerHTML='<tr><td colspan="7">'+esc(r.error.message)+'</td></tr>';$('orders').innerHTML=(r.data||[]).map(o=>`<tr><td><b>#${esc(o.id)}</b><br><small>${new Date(o.created_at).toLocaleString('en-IN')}</small></td><td>${esc(o.customer_name)}<br>${esc(o.phone)}</td><td>${esc(o.address)}, ${esc(o.city)} - ${esc(o.pincode)}</td><td>₹${Number(o.total_amount||0).toLocaleString('en-IN')}</td><td>COD<br>${esc(o.payment_status||'pending')}</td><td><select id="st-${o.id}">${['Pending','Confirmed','Packed','Shipped','Out for Delivery','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn" onclick="updateOrder('${o.id}')">Update</button></td></tr>`).join('')||'<tr><td colspan="7">No orders.</td></tr>'}
async function updateOrder(id){const status=$('st-'+id).value;if(status==='Cancelled'){if(!confirm('Cancel this order and restore its reserved stock?'))return;const r=await sb.rpc('cancel_store_order',{p_order_id:id});if(r.error)return alert(r.error.message)}else{const data={status,updated_at:new Date().toISOString(),...(status==='Delivered'?{payment_status:'paid'}:{})};const r=await sb.from('orders').update(data).eq('id',id);if(r.error)return alert(r.error.message)}loadOrders();load()}
load();</script></body></html>
