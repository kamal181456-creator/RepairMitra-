<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Product - RepairMitra</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;padding:15px;background:#f4f7fb;font-family:Arial;color:#172033}.box{max-width:760px;margin:auto;background:#fff;padding:18px;border-radius:17px;box-shadow:0 7px 25px #0001}input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #ccd5e2;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:10px;padding:11px 14px;background:#2563eb;color:#fff;font-weight:700}.success{background:#16834b}.secondary{background:#eef2f7;color:#172033}.sizes{border:1px solid #dbe3ec;border-radius:12px;padding:12px;background:#f8fafc}.sizesgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.msg{padding:10px;border-radius:10px;margin:8px 0}.ok{background:#eaf8ef;color:#166534}.err{background:#fff0f0;color:#991b1b}#preview{max-width:180px;max-height:180px;border-radius:12px;margin-top:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}.sizesgrid{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h2>✏️ Edit Product</h2><button class="btn secondary" onclick="history.back()">← Back</button></div><div id="msg"></div><input id="name" placeholder="Product Name *"><div class="grid"><select id="category"><option>New Mobile</option><option>Old Mobile</option><option>Keypad Mobile</option><option>Footwear</option><option>Accessories</option></select><input id="brand" placeholder="Brand"></div><div class="grid"><input id="model" placeholder="Model"><input id="sku" placeholder="SKU / Barcode"></div><div class="grid"><input id="price" type="number" min="0" placeholder="Selling Price *"><input id="purchase" type="number" min="0" placeholder="Purchase Price"></div><input id="stock" type="number" min="0" placeholder="Stock"><div style="border:1px dashed #94a3b8;border-radius:12px;padding:12px;background:#f8fafc"><b>🖼️ Product Photo</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:9px"><button class="btn" type="button" onclick="camera.click()">📷 Camera</button><button class="btn" type="button" onclick="gallery.click()">🖼️ Gallery</button></div><input id="camera" type="file" accept="image/*" capture="environment" hidden><input id="gallery" type="file" accept="image/*" hidden><img id="preview" hidden><input id="image" placeholder="Image URL"></div><div id="sizes" class="sizes" style="display:none;margin-top:10px"><b>👟 Footwear Sizes</b><div class="sizesgrid" style="margin-top:8px"><label><input type="checkbox" value="5"> 5</label><label><input type="checkbox" value="6"> 6</label><label><input type="checkbox" value="7"> 7</label><label><input type="checkbox" value="8"> 8</label><label><input type="checkbox" value="9"> 9</label><label><input type="checkbox" value="10"> 10</label><label><input type="checkbox" value="11"> 11</label><label><input type="checkbox" value="12"> 12</label></div></div><textarea id="description" placeholder="Description"></textarea><button class="btn success" style="width:100%" onclick="save()">💾 Save Changes</button></div><script>const sb=supabase.createClient('https://rqnmshqrwntxilwnhqwa.supabase.co','sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v');const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('id');let original=null;function show(t,ok=false){$('msg').innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+t+'</div>'}function sync(){const on=$('category').value==='Footwear';$('sizes').style.display=on?'block':'none'}$('category').onchange=sync;function setImage(v){$('image').value=v||'';if(v){$('preview').src=v;$('preview').hidden=false}else $('preview').hidden=true}function compress(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1000,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,im.width*s);c.height=Math.max(1,im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}async function pick(e){const f=e.target.files?.[0];if(!f)return;try{setImage(await compress(f))}catch(_){show('Could not read this image.')}e.target.value=''}camera.onchange=pick;gallery.onchange=pick;async function load(){if(!id)return show('Product ID is missing.');const r=await sb.from('products').select('*').eq('id',id).maybeSingle();if(r.error||!r.data)return show('Product not found.');original=r.data;$('name').value=r.data.name||'';$('category').value=r.data.category||'New Mobile';$('brand').value=r.data.brand||'';$('model').value=r.data.model||'';$('sku').value=r.data.sku||'';$('price').value=r.data.price??'';$('purchase').value=r.data.purchase_price??'';$('stock').value=r.data.stock_quantity??'';setImage(r.data.image_url||'');$('description').value=r.data.description||'';sync();const ss=String(r.data.sizes||'').split(',').map(x=>x.trim());document.querySelectorAll('#sizes input').forEach(x=>x.checked=ss.includes(x.value))}async function save(){const name=$('name').value.trim(),price=Number($('price').value);if(!name)return show('Product name is required.');if(!Number.isFinite(price)||price<0)return show('Enter a valid selling price.');const data={name,category:$('category').value,brand:$('brand').value.trim()||null,model:$('model').value.trim()||null,sku:$('sku').value.trim()||null,price,purchase_price:Number($('purchase').value)||0,stock_quantity:Number($('stock').value)||0,image_url:$('image').value.trim()||null,description:$('description').value.trim()||null,sizes:[...document.querySelectorAll('#sizes input:checked')].map(x=>x.value).join(','),updated_at:new Date().toISOString()};const r=await sb.from('products').update(data).eq('id',id);if(r.error)return show(r.error.message);show('Product updated successfully.',true);setTimeout(()=>history.back(),700)}load();</script></body></html>
