<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepairMitra • Subscription Management</title><style>body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f7fb;color:#142033}header{background:#0b1220;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}main{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 10px 30px #0f172a10}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.plan{border:1px solid #e6eaf0;border-radius:16px;padding:16px}.plan h3{margin:0}.price{font-size:25px;font-weight:800;margin:8px 0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}.light{background:#eef2f7;color:#142033}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #edf0f4;font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:#667085;background:#f8fafc}.wrap{overflow:auto}.msg{padding:10px;border-radius:10px;margin:10px 0;display:none}.ok{display:block;background:#eaf8ef;color:#166534}.err{display:block;background:#fff0f0;color:#991b1b}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>🛠️ RepairMitra Admin • Subscriptions</b><button class="btn light" onclick="location.href='../admin.html'">← Dashboard</button></header><main><div id="msg" class="msg"></div><section class="card"><h2>Subscription Plans</h2><p>Manage the plans available to vendors.</p><div id="plans" class="grid">Loading...</div></section><section class="card"><h2>Vendor Subscriptions</h2><div class="wrap"><table class="table"><thead><tr><th>Vendor</th><th>Plan</th><th>Status</th><th>Start</th><th>End</th><th>Auto Renew</th><th>Payment Ref</th></tr></thead><tbody id="subs">Loading...</tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://rqnmshqrwntxilwnhqwa.supabase.co','sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v');const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function msg(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}function money(n){return Number(n||0).toLocaleString('en-IN')}function dt(v){return v?new Date(v).toLocaleDateString('en-IN'):'—'}async function admin(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='./';return false}const r=await sb.from('profiles').select('role,is_active').eq('id',user.id).maybeSingle();if(r.error||!r.data||r.data.role!=='admin'||r.data.is_active===false){await sb.auth.signOut();location.href='./';return false}return true}async function load(){if(!await admin())return;const p=await sb.from('subscription_plans').select('*').order('price');if(p.error){msg(p.error.message);return}const plans=p.data||[];$('plans').innerHTML=plans.length?plans.map(x=>'<div class="plan"><h3>'+esc(x.name)+'</h3><div class="price">₹'+money(x.price)+'</div><div>'+esc(x.duration_days)+' days</div><div>Repairs: '+(x.repair_limit==null?'Unlimited':esc(x.repair_limit))+'</div><div>Quotes: '+(x.quote_limit==null?'Unlimited':esc(x.quote_limit))+'</div><div>'+(x.priority_support?'Priority support':'Standard support')+'</div><p><b>'+(x.is_active?'Active':'Inactive')+'</b></p></div>').join(''):'No plans found.';const s=await sb.from('vendor_subscriptions').select('*').order('created_at',{ascending:false});if(s.error){$('subs').innerHTML='<tr><td colspan="7">'+esc(s.error.message)+'</td></tr>';return}const rows=s.data||[];$('subs').innerHTML=rows.length?rows.map(x=>'<tr><td>'+esc(x.vendor_id)+'</td><td>'+esc(plans.find(p=>p.id===x.plan_id)?.name||x.plan_id)+'</td><td>'+esc(x.status)+'</td><td>'+dt(x.started_at)+'</td><td>'+dt(x.ends_at)+'</td><td>'+(x.auto_renew?'Yes':'No')+'</td><td>'+esc(x.payment_reference||'—')+'</td></tr>').join(''):'<tr><td colspan="7">No vendor subscriptions yet.</td></tr>'}load();</script></body></html>
