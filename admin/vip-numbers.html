<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP Number Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px #0001;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;padding:11px;border:1px solid #ccd5e2;border-radius:10px;margin:5px 0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}.gold{background:#d79d17;color:#111}.danger{background:#dc2626}.secondary{background:#eef2f7;color:#172033}.muted{color:#64748b}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:13px}.status{padding:5px 8px;border-radius:15px;font-weight:700}.msg{padding:10px;border-radius:10px;margin-top:10px}.ok{color:#166534;background:#eaf8ef}.err{color:#991b1b;background:#fff0f0}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;place-items:center;padding:12px}.modal.show{display:grid}.modalbox{background:#fff;width:min(520px,100%);border-radius:18px;padding:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h1>⭐ VIP Number Management</h1><p class="muted">Add, edit, delete and manage Sale/Booking status and customer requests.</p></div><button class="btn secondary" onclick="location.href='./index.html'">← Admin</button></div><div class="grid"><input id="num" placeholder="VIP Number *"><input id="price" type="number" min="0" placeholder="Price (₹) *"><select id="status"><option value="available">For Sale / Available</option><option value="booked">Booked</option><option value="sold">Sold</option></select></div><button class="btn gold" id="saveBtn" onclick="saveNumber()">➕ Add VIP Number</button><button class="btn secondary" onclick="resetForm()">Clear</button><div id="msg"></div></div><div class="card"><h2>VIP Number List</h2><div class="table"><table><thead><tr><th>Number</th><th>Price</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h2>📞 Booking / Sale Requests</h2><div class="table"><table><thead><tr><th>Number</th><th>Customer</th><th>Phone</th><th>Type</th><th>Offer</th><th>Status</th><th>Action</th></tr></thead><tbody id="bookingRows"></tbody></table></div></div></div><div id="editModal" class="modal"><div class="modalbox"><h2>✏️ Edit VIP Number</h2><p class="muted">Update number, price or availability.</p><input id="enumber" placeholder="VIP Number"><input id="eprice" type="number" min="0" placeholder="Price"><select id="estatus"><option value="available">For Sale / Available</option><option value="booked">Booked</option><option value="sold">Sold</option></select><div style="display:flex;gap:8px;margin-top:8px"><button class="btn gold" onclick="saveEdit()">💾 Save Changes</button><button class="btn secondary" onclick="closeEdit()">Cancel</button></div><div id="editMsg"></div></div></div><script>const sb=supabase.createClient('https://rqnmshqrwntxilwnhqwa.supabase.co','sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v');const $=id=>document.getElementById(id);let editingId=null;function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function note(id,t,ok=false){$(id).innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>'}async function guard(){const s=await sb.auth.getSession();if(!s.data.session){location.href='../admin/';return false}const p=await sb.from('profiles').select('role,is_active').eq('id',s.data.session.user.id).maybeSingle();if(p.error||p.data?.role!=='admin'||p.data?.is_active===false){await sb.auth.signOut();location.href='../admin/';return false}return true}function resetForm(){$('num').value='';$('price').value='';$('status').value='available';$('saveBtn').textContent='➕ Add VIP Number';editingId=null;$('msg').innerHTML=''}function openEdit(x){editingId=x.id;$('enumber').value=x.phone_number||'';$('eprice').value=x.price??0;$('estatus').value=x.status||'available';$('editMsg').innerHTML='';$('editModal').classList.add('show')}function closeEdit(){$('editModal').classList.remove('show');editingId=null}async function saveNumber(){const n=$('num').value.trim(),price=Number($('price').value),status=$('status').value;if(!n||!Number.isFinite(price)||price<0)return note('msg','Enter number and a valid price.');const r=await sb.from('vip_numbers').insert({phone_number:n,price,status,updated_at:new Date().toISOString()});if(r.error)return note('msg',r.error.message);note('msg','VIP number added successfully.',true);resetForm();await load()}async function saveEdit(){if(!editingId)return;const n=$('enumber').value.trim(),price=Number($('eprice').value),status=$('estatus').value;if(!n||!Number.isFinite(price)||price<0)return note('editMsg','Enter number and a valid price.');const r=await sb.from('vip_numbers').update({phone_number:n,price,status,updated_at:new Date().toISOString()}).eq('id',editingId);if(r.error)return note('editMsg',r.error.message);closeEdit();note('msg','VIP number updated successfully.',true);await load()}async function del(id){if(!confirm('Delete this VIP number?'))return;const r=await sb.from('vip_numbers').delete().eq('id',id);if(r.error)return note('msg',r.error.message);await load()}async function load(){const r=await sb.from('vip_numbers').select('*').order('created_at',{ascending:false});if(r.error){$('rows').innerHTML='<tr><td colspan="5">'+esc(r.error.message)+'</td></tr>'}else $('rows').innerHTML=(r.data||[]).map(x=>'<tr><td><b>'+esc(x.phone_number)+'</b></td><td>₹'+Number(x.price||0).toLocaleString('en-IN')+'</td><td><span class="status">'+esc(x.status)+'</span></td><td>'+new Date(x.created_at).toLocaleDateString('en-IN')+'</td><td><button class="btn secondary" onclick=\'openEdit('+JSON.stringify(x).replace(/</g,'\\u003c')+')\'>Edit</button> <button class="btn danger" onclick="del(\''+x.id+'\')">Delete</button></td></tr>').join('')||'<tr><td colspan="5">No numbers yet.</td></tr>';const b=await sb.from('vip_bookings').select('*').order('created_at',{ascending:false});if(b.error){$('bookingRows').innerHTML='<tr><td colspan="7">'+esc(b.error.message)+'</td></tr>';return}$('bookingRows').innerHTML=(b.data||[]).map(x=>'<tr><td>'+esc(x.phone_number)+'</td><td>'+esc(x.customer_name)+'</td><td>'+esc(x.customer_phone)+'</td><td>'+esc(x.booking_type)+'</td><td>'+ (x.offered_price?'₹'+Number(x.offered_price).toLocaleString('en-IN'):'—')+'</td><td>'+esc(x.status)+'</td><td><select onchange="setBooking(\''+x.id+'\',this.value)"><option '+(x.status==='pending'?'selected':'')+'>pending</option><option '+(x.status==='confirmed'?'selected':'')+'>confirmed</option><option '+(x.status==='completed'?'selected':'')+'>completed</option><option '+(x.status==='cancelled'?'selected':'')+'>cancelled</option></select></td></tr>').join('')||'<tr><td colspan="7">No booking requests yet.</td></tr>'}async function setBooking(id,status){const r=await sb.from('vip_bookings').update({status}).eq('id',id);if(r.error)return note('msg',r.error.message);await load()}guard().then(ok=>ok&&load());</script></body></html>
