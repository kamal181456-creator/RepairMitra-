<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP Number Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px #0001;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;padding:11px;border:1px solid #ccd5e2;border-radius:10px;margin:5px 0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}.gold{background:#d79d17;color:#111}.danger{background:#dc2626}.muted{color:#64748b}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:13px}.ok{color:#166534;background:#eaf8ef}.status{padding:5px 8px;border-radius:15px;font-weight:700}.msg{padding:10px;border-radius:10px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>⭐ VIP Number Management</h1><p class="muted">Add numbers, set price, mark Sale/Booking status and manage customer requests.</p><div class="grid"><input id="num" placeholder="VIP Number *"><input id="price" type="number" min="0" placeholder="Price (₹) *"><select id="status"><option value="available">For Sale / Available</option><option value="booked">Booked</option><option value="sold">Sold</option></select></div><button class="btn gold" onclick="addNumber()">➕ Add VIP Number</button><div id="msg"></div></div><div class="card"><h2>VIP Number List</h2><div class="table"><table><thead><tr><th>Number</th><th>Price</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h2>📞 Booking / Sale Requests</h2><div class="table"><table><thead><tr><th>Number</th><th>Customer</th><th>Phone</th><th>Type</th><th>Offer</th><th>Status</th><th>Action</th></tr></thead><tbody id="bookingRows"></tbody></table></div></div></div><script>const sb=supabase.createClient('https://rqnmshqrwntxilwnhqwa.supabase.co','sb_publishable_irYxUMcbJIIKVkCtyxjp-w_piB5mu7v');const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function guard(){const s=await sb.auth.getSession();if(!s.data.session){location.href='../admin/';return false}const p=await sb.from('profiles').select('role,is_active').eq('id',s.data.session.user.id).maybeSingle();if(p.data?.role!=='admin'||p.data?.is_active===false){await sb.auth.signOut();location.href='../admin/';return false}return true}async function addNumber(){const n=$('num').value.trim(),price=Number($('price').value),status=$('status').value;if(!n||price<0)return $('msg').innerHTML='<div class="msg" style="background:#fff0f0;color:#991b1b">Enter number and price.</div>';const r=await sb.from('vip_numbers').insert({phone_number:n,price,status});if(r.error)return $('msg').innerHTML='<div class="msg" style="background:#fff0f0;color:#991b1b">'+esc(r.error.message)+'</div>';$('num').value='';$('price').value='';$('msg').innerHTML='<div class="msg ok">VIP number added.</div>';load()}async function load(){const r=await sb.from('vip_numbers').select('*').order('created_at',{ascending:false});$('rows').innerHTML=(r.data||[]).map(x=>`<tr><td><b>${esc(x.phone_number)}</b></td><td>₹${Number(x.price).toLocaleString('en-IN')}</td><td><span class="status ${x.status==='available'?'ok':''}">${esc(x.status)}</span></td><td>${new Date(x.created_at).toLocaleDateString('en-IN')}</td><td><button class="btn danger" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No numbers yet.</td></tr>';const b=await sb.from('vip_bookings').select('*').order('created_at',{ascending:false});$('bookingRows').innerHTML=(b.data||[]).map(x=>`<tr><td>${esc(x.phone_number)}</td><td>${esc(x.customer_name)}</td><td>${esc(x.customer_phone)}</td><td>${esc(x.booking_type)}</td><td>${x.offered_price?'₹'+Number(x.offered_price).toLocaleString('en-IN'):'—'}</td><td>${esc(x.status)}</td><td><select onchange="setBooking('${x.id}',this.value)"><option ${x.status==='pending'?'selected':''}>pending</option><option ${x.status==='confirmed'?'selected':''}>confirmed</option><option ${x.status==='completed'?'selected':''}>completed</option><option ${x.status==='cancelled'?'selected':''}>cancelled</option></select></td></tr>`).join('')||'<tr><td colspan="7">No booking requests yet.</td></tr>'}async function del(id){if(!confirm('Delete this VIP number?'))return;await sb.from('vip_numbers').delete().eq('id',id);load()}async function setBooking(id,status){await sb.from('vip_bookings').update({status}).eq('id',id);load()}guard().then(ok=>ok&&load());</script></body></html>
