<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>RepairMitra Admin</title>
</head>
<body>
<h2>🛠️ RepairMitra Admin</h2>
<p id="status">Loading Admin Control Center…</p>
<script>
(async function(){
  try {
    const r=await fetch('../admin-unified.html?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('Admin panel could not be loaded');
    let html=await r.text();
    html=html.replace(/<\/body>/i,'<script src="../admin-product-fix.js?v=20260908-2"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    const s=document.getElementById('status');
    if(s) s.textContent='Unable to open Admin Panel: '+(e.message||e);
  }
})();
</script>
</body>
</html>
