<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>RepairMitra Admin</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}#dashboardAddProduct,#vipButton{display:none;position:fixed;right:22px;z-index:99999;border:0;border-radius:10px;padding:11px 16px;color:#fff;font:700 14px Arial,sans-serif;box-shadow:0 4px 14px #0004;cursor:pointer}#dashboardAddProduct{top:18px;background:#2563eb}#vipButton{top:68px;background:#d79d17;color:#111}@media(max-width:600px){#dashboardAddProduct,#vipButton{right:12px;padding:10px 13px;font-size:13px}#vipButton{top:62px}}</style></head><body><iframe id="adminFrame" title="RepairMitra Admin" src="../admin-unified.html?v=20260909-7"></iframe><button id="dashboardAddProduct" type="button">➕ Add Product</button><button id="vipButton" type="button">⭐ VIP Numbers</button><script>(function(){'use strict';var f=document.getElementById('adminFrame'),a=document.getElementById('dashboardAddProduct'),v=document.getElementById('vipButton');function visible(){try{return !!f.contentDocument.getElementById('app')}catch(e){return false}}function update(){var x=visible();a.style.display=x?'block':'none';v.style.display=x?'block':'none'}f.addEventListener('load',function(){update()});a.onclick=function(){try{var w=f.contentWindow;w.tab('products');setTimeout(function(){w.openProduct()},250)}catch(e){}};v.onclick=function(){location.href='../vip-numbers.html'};})();</script></body></html>
