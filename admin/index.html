<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepairMitra Admin</title><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"></head><body><h2>🛠️ RepairMitra Admin</h2><p id="status">Loading Admin Control Center…</p><script>(async()=>{try{const r=await fetch('../admin-unified.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Admin panel could not be loaded');let h=await r.text();const fix=`<style>.product-thumb{width:52px;height:52px;object-fit:cover;border-radius:9px;border:1px solid #ddd;background:#f8fafc}.edit-btn{background:#2563eb!important;color:#fff!important}.scan-help{font-size:12px;color:#64748b;margin-top:-5px;margin-bottom:8px}</style><script>(function(){let scanInstance=null;let scanRunning=false;let originalLoaded=false;function q(id){return document.getElementById(id)}function msg(t,ok){if(typeof show==='function'&&q('pmsg'))show('pmsg',t,!!ok)}function setImage(src){const p=q('pimage'),im=q('productImagePreview');if(p)p.value=src||'';if(im&&src){im.src=src;im.style.display='block'}}async function compressImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');const rd=new FileReader();rd.onerror=reject;rd.onload=()=>{const img=new Image();img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.82);if(data.length>1100000)data=c.toDataURL('image/jpeg',.65);resolve(data)};img.onerror=reject;img.src=rd.result};rd.readAsDataURL(file)})}function initImage(){const f=q('productImageUpload'),p=q('pimage'),im=q('productImagePreview');if(!f||f.dataset.fixReady)return;f.dataset.fixReady='1';f.onchange=async()=>{const file=f.files&&f.files[0];if(!file)return;if(file.size>8000000){alert('Please choose an image under 8 MB.');f.value='';return}try{const data=await compressImage(file);setImage(data)}catch(e){alert('Could not read image.')}};if(p&&p.value&&im){im.src=p.value;im.style.display='block'}}async function lookupBarcode(code){code=String(code||'').trim();if(!code)return null;try{const r=await fetch('https://api.upcitemdb.com/prod/trial/lookup?upc='+encodeURIComponent(code));if(r.ok){const j=await r.json();const it=j.items&&j.items[0];if(it)return {name:it.title||'',brand:it.brand||'',model:it.model||'',image:(it.images&&it.images[0])||'',description:it.description||''}}}catch(e){}return null}function fillScan(raw){const code=String(raw||'').trim();if(!code)return;let data=null;try{data=JSON.parse(code)}catch(e){}if(data&&typeof data==='object'){if(data.name)q('pn').value=data.name;if(data.product_name)q('pn').value=data.product_name;if(data.brand)q('pb').value=data.brand;if(data.model)q('pmodel').value=data.model;if(data.sku||data.barcode)q('psku').value=data.sku||data.barcode;if(data.price!=null)q('pprice').value=data.price;if(data.purchase_price!=null)q('ppurchase').value=data.purchase_price;if(data.stock!=null)q('pstock').value=data.stock;if(data.category)q('pc').value=data.category;if(data.description)q('pdesc').value=data.description;if(data.image_url||data.image)setImage(data.image_url||data.image);return}q('psku').value=code;lookupBarcode(code).then(x=>{if(x){if(x.name&&!q('pn').value)q('pn').value=x.name;if(x.brand&&!q('pb').value)q('pb').value=x.brand;if(x.model&&!q('pmodel').value)q('pmodel').value=x.model;if(x.description&&!q('pdesc').value)q('pdesc').value=x.description;if(x.image)setImage(x.image);msg('Barcode found. Details auto-filled.',true)}else msg('Barcode scanned. SKU saved. Product details were not found online; enter price and stock manually.',true)})}window.openScanner=async function(){const m=q('scannerModal');if(!m)return;m.classList.add('show');q('scanStatus').textContent='Starting camera…';try{if(scanInstance){try{await scanInstance.stop()}catch(e){}try{scanInstance.clear()}catch(e){}}scanInstance=new Html5Qrcode('reader',{verbose:false});const cams=await Html5Qrcode.getCameras();if(!cams||!cams.length)throw new Error('No camera found');const rear=cams.find(c=>/back|rear|environment/i.test(c.label))||cams[0];const formats=[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.ITF];await scanInstance.start(rear.id,{fps:10,qrbox:{width:260,height:180},aspectRatio:1.5,formatsToSupport:formats},(decoded)=>{if(scanRunning)return;scanRunning=true;fillScan(decoded);q('scanStatus').textContent='✅ Code scanned successfully';setTimeout(()=>window.closeScanner(),350);},()=>{});scanRunning=false;q('scanStatus').textContent='Camera active — point at the QR/barcode';}catch(e){scanRunning=false;q('scanStatus').textContent='Camera error: '+(e.message||e)+' — allow camera permission and use HTTPS.'}};window.closeScanner=async function(){try{if(scanInstance){await scanInstance.stop();scanInstance.clear()}}catch(e){}scanInstance=null;scanRunning=false;if(q('scannerModal'))q('scannerModal').classList.remove('show')};window.openProduct=function(p){editingId=p&&p.id||null;if(q('pt'))q('pt').textContent=editingId?'✏️ Edit Product':'➕ Add Product';[['pn','name'],['pc','category'],['pb','brand'],['pmodel','model'],['psku','sku'],['pprice','price'],['ppurchase','purchase_price'],['pstock','stock_quantity'],['pimage','image_url'],['pdesc','description']].forEach(([a,b])=>{if(q(a))q(a).value=p&&p[b]!=null?p[b]:''});setImage(p&&p.image_url||'');if(q('pmsg'))q('pmsg').innerHTML='';initImage();if(q('pm'))q('pm').classList.add('show')};window.closeProduct=function(){if(q('pm'))q('pm').classList.remove('show');editingId=null};window.saveProduct=async function(){const name=q('pn')?.value.trim(),price=Number(q('pprice')?.value);if(!name||!price)return msg('Product name and selling price are required.');const sku=q('psku')?.value.trim()||null;const data={name,category:q('pc')?.value||'New Mobile',brand:q('pb')?.value.trim()||null,model:q('pmodel')?.value.trim()||null,sku,price,purchase_price:Number(q('ppurchase')?.value)||0,stock_quantity:Number(q('pstock')?.value)||0,image_url:q('pimage')?.value.trim()||null,description:q('pdesc')?.value.trim()||null,updated_at:new Date().toISOString()};let r=editingId?await sb.from('products').update(data).eq('id',editingId):await sb.from('products').insert(data);if(r.error){if(r.error.code==='23505')return msg('This SKU/barcode already exists. Use a different SKU.');return msg((r.error.message||'Could not save product')+(r.error.hint?' — '+r.error.hint:''))}msg(editingId?'Product updated successfully.':'Product saved successfully.',true);await loadProducts();await loadStock();await loadDashboard();setTimeout(closeProduct,450)};window.loadProducts=async function(){const r=await sb.from('products').select('*').order('created_at',{ascending:false});if(r.error){products=[];if(q('productsRows'))q('productsRows').innerHTML='<tr><td colspan="6">'+esc(r.error.message)+'</td></tr>';return}products=r.data||[];renderProducts()};window.renderProducts=function(){const body=q('productsRows');if(!body)return;const term=(q('search')?.value||'').toLowerCase().trim();const list=products.filter(p=>!term||[p.name,p.brand,p.model,p.sku,p.category].some(v=>String(v||'').toLowerCase().includes(term)));if(!list.length){body.innerHTML='<tr><td colspan="6" class="muted">No products found.</td></tr>';return}body.innerHTML=list.map(p=>'<tr><td><div style="display:flex;align-items:center;gap:9px">'+(p.image_url?'<img class="product-thumb" src="'+esc(p.image_url)+'" onerror="this.style.display=\\'none\\'">':'<div class="product-thumb" style="display:grid;place-items:center">📦</div>')+'<div><b>'+esc(p.name)+'</b><br><small class="muted">'+esc(p.brand||'')+' '+esc(p.model||'')+'</small></div></div></td><td>'+esc(p.category||'')+'</td><td>'+esc(p.sku||'—')+'</td><td>₹'+esc(p.price)+'</td><td>'+esc(p.stock_quantity??p.stock??0)+'</td><td><div class="actions"><button class="btn edit-btn" onclick="openProduct(products.find(x=>x.id===\\''+String(p.id).replace(/'/g,'')+'\\'))">✏️ Edit</button><button class="btn danger" onclick="deleteProduct(\\''+String(p.id).replace(/'/g,'')+'\\')">🗑️ Delete</button></div></td></tr>').join('')};window.deleteProduct=async function(id){if(!confirm('Delete this product?'))return;const r=await sb.from('products').delete().eq('id',id);if(r.error)return alert(r.error.message);await loadProducts();await loadStock();await loadDashboard()};const oldTab=window.tab;window.tab=function(n,b){if(oldTab)oldTab(n,b);if(n==='products')setTimeout(()=>{loadProducts();initImage()},80)};function boot(){initImage();const pm=q('pm');if(pm)new MutationObserver(()=>initImage()).observe(pm,{childList:true,subtree:true});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();setTimeout(boot,500);setTimeout(boot,1500)})();<\\/script>`;h=h.replace('<input id="pimage" placeholder="Image URL">','<div style="border:1px dashed #94a3b8;border-radius:12px;padding:12px;margin:5px 0 10px;background:#f8fafc;text-align:left"><b>🖼️ Product Image</b><input id="productImageUpload" type="file" accept="image/*" capture="environment" style="width:100%;margin-top:8px"><small>📷 Camera or Gallery • Image is compressed automatically</small><img id="productImagePreview" style="display:none;max-width:160px;max-height:160px;margin-top:8px;border-radius:10px"><input id="pimage" placeholder="Image URL" style="margin-top:8px"></div>');h=h.replace('</body>',fix+'</body>');document.open();document.write(h);document.close()}catch(e){document.getElementById('status').textContent='Unable to open Admin Panel: '+e.message}})();</script></body></html>
