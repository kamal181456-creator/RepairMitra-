<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>RepairMitra Admin</title>
<style>
html,body,iframe{margin:0;width:100%;height:100%;border:0}
body{overflow:hidden}
#dashboardAddProduct{display:none;position:fixed;right:22px;top:18px;z-index:99999;border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:#fff;font:700 14px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer}
@media(max-width:600px){#dashboardAddProduct{right:12px;top:12px;padding:10px 13px;font-size:13px}}
</style>
</head>
<body>
<iframe id="adminFrame" title="RepairMitra Admin"></iframe>
<button id="dashboardAddProduct" type="button">➕ Add Product</button>
<script>
const frame=document.getElementById('adminFrame');
const quickAdd=document.getElementById('dashboardAddProduct');
frame.src='../admin-unified.html?v=20260908-10';
let fixLoaded=false;
function loadProductFix(){
  if(fixLoaded)return;
  const d=frame.contentDocument;
  if(!d||!d.body)return;
  if(d.getElementById('repairMitraProductFix')){fixLoaded=true;return;}
  const s=d.createElement('script');
  s.id='repairMitraProductFix';
  /* The iframe document is /admin-unified.html, so /admin/ is NOT the base. */
  s.src='admin/product-management-fix.js?v=20260908-10';
  s.onload=()=>{fixLoaded=true;};
  s.onerror=()=>{fixLoaded=false;};
  d.body.appendChild(s);
}
function adminReady(){const d=frame.contentDocument;if(!d)return false;const app=d.getElementById('app');return !!app&&getComputedStyle(app).display!=='none';}
function updateQuickButton(){quickAdd.style.display=adminReady()?'block':'none';}
function openAddProductFromDashboard(){const w=frame.contentWindow;if(!w)return;try{if(typeof w.tab==='function')w.tab('products');setTimeout(()=>{if(typeof w.openProduct==='function')w.openProduct();},150);}catch(e){console.error(e)}}
quickAdd.addEventListener('click',openAddProductFromDashboard);
function install(){loadProductFix();updateQuickButton();}
frame.addEventListener('load',()=>{fixLoaded=false;install();setTimeout(install,300);setTimeout(install,1000);setTimeout(install,2500);setTimeout(install,5000);});
setInterval(install,1000);
</script>
</body>
</html>
