<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepairMitra Admin</title><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><style>body{font-family:Arial,sans-serif;text-align:center;padding:40px;background:#f4f7fb;color:#172033}#status{margin-top:20px;color:#64748b}</style></head><body><h2>🛠️ RepairMitra Admin</h2><p id="status">Loading Admin Control Center…</p><script>(async()=>{try{const r=await fetch('../admin-unified.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Admin panel could not be loaded');let h=await r.text();const enhancement=`<style id="productEnhancementStyle">.adminQuickAdd{margin-top:12px!important;background:#16834b!important}.uploadBox{border:1px dashed #94a3b8;border-radius:12px;padding:12px;margin:4px 0 10px;background:#f8fafc}.uploadBox input{margin:7px 0;width:100%}.previewImg{display:none;max-width:140px;max-height:140px;border-radius:10px;object-fit:cover;margin-top:8px;border:1px solid #e2e8f0}.scanHint{font-size:12px;color:#64748b;margin:-4px 0 10px}</style><script>(function(){function setup(){var p=document.getElementById('pimage');if(!p||document.getElementById('productImageUpload'))return;var box=document.createElement('div');box.className='uploadBox';box.innerHTML='<b>🖼️ Product Image Upload</b><input id="productImageUpload" type="file" accept="image/*" capture="environment"><div class="scanHint">Choose an image from Gallery or Camera. It will be attached automatically.</div><img id="productImagePreview" class="previewImg">';p.parentNode.insertBefore(box,p);var f=document.getElementById('productImageUpload'),im=document.getElementById('productImagePreview');f.addEventListener('change',function(){var file=f.files&&f.files[0];if(!file)return;if(file.size>2500000){alert('Please choose an image under 2.5 MB.');f.value='';return}var rd=new FileReader();rd.onload=function(){p.value=rd.result;im.src=rd.result;im.style.display='block'};rd.readAsDataURL(file)});var add=document.createElement('button');add.className='btn adminQuickAdd';add.textContent='➕ Add Product';add.onclick=function(){if(typeof window.openProduct==='function')window.openProduct()};var cards=document.querySelector('#dashboard .card .actions');if(cards&&!document.getElementById('dashboardQuickAdd')){add.id='dashboardQuickAdd';cards.appendChild(add)}var nav=document.querySelector('#nav button[onclick*="tab(\'products\'")]');if(nav&&!document.getElementById('navAddProduct')){var b=document.createElement('button');b.id='navAddProduct';b.className='btn adminQuickAdd';b.textContent='➕ Add Product';b.onclick=function(){if(typeof window.openProduct==='function')window.openProduct()};nav.parentNode.appendChild(b)}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();setTimeout(setup,500);setTimeout(setup,1500);})();<\/script>`;h=h.replace('</body>',enhancement+'</body>');document.open();document.write(h);document.close()}catch(e){document.getElementById('status').textContent='Unable to open Admin Panel: '+e.message}})();</script></body></html>
