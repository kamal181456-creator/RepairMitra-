<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<title>RepairMitra Admin</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}#dashboardAddProduct,#vipButton{display:none;position:fixed;right:22px;z-index:99999;border:0;border-radius:10px;padding:11px 16px;color:#fff;font:700 14px Arial,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer}#dashboardAddProduct{top:18px;background:#2563eb}#vipButton{top:68px;background:#d79d17;color:#111}@media(max-width:600px){#dashboardAddProduct,#vipButton{right:12px;padding:10px 13px;font-size:13px}#vipButton{top:62px}}</style>
</head>
<body>
<iframe id="adminFrame" title="RepairMitra Admin"></iframe>
<button id="dashboardAddProduct" type="button">➕ Add Product</button>
<button id="vipButton" type="button">⭐ VIP Numbers</button>
<script>
(function(){
'use strict';
const frame=document.getElementById('adminFrame'),quickAdd=document.getElementById('dashboardAddProduct'),vipButton=document.getElementById('vipButton');
const V='20260909-5';
let injected=false;
frame.src='../admin-unified.html?v='+V;
function ready(){try{const d=frame.contentDocument,a=d&&d.getElementById('app');return !!a&&getComputedStyle(a).display!=='none'}catch(e){return false}}
function buttons(){const ok=ready();quickAdd.style.display=ok?'block':'none';vipButton.style.display=ok?'block':'none'}
function injectOnce(){
 if(injected)return;
 try{
  const d=frame.contentDocument;
  if(!d||!d.body)return;
  if(d.getElementById('repairMitraProductFix')){injected=true;buttons();return}
  const s=d.createElement('script');
  s.id='repairMitraProductFix';
  s.src='admin/product-management-fix.js?v='+V;
  s.onload=function(){injected=true;buttons()};
  s.onerror=function(){injected=false;console.error('Product Management fix failed to load')};
  d.body.appendChild(s);
 }catch(e){console.error(e)}
}
frame.addEventListener('load',function(){injectOnce();setTimeout(buttons,250)});
quickAdd.onclick=function(){try{const w=frame.contentWindow;if(typeof w.tab==='function')w.tab('products');setTimeout(function(){if(typeof w.openProduct==='function')w.openProduct()},200)}catch(e){}};
vipButton.onclick=function(){location.href='../vip-numbers.html'};
setInterval(buttons,1500);
})();
</script>
</body>
</html>
