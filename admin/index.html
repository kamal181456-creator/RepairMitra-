<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>RepairMitra Admin</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}#dashboardAddProduct,#editProductButton,#vipButton{display:none;position:fixed;right:22px;z-index:99999;border:0;border-radius:10px;padding:11px 16px;color:#fff;font:700 14px Arial,sans-serif;box-shadow:0 4px 14px #0004;cursor:pointer}#dashboardAddProduct{top:18px;background:#2563eb}#editProductButton{top:68px;background:#16834b}#vipButton{top:118px;background:#d79d17;color:#111}@media(max-width:600px){#dashboardAddProduct,#editProductButton,#vipButton{right:12px;padding:10px 13px;font-size:13px}#editProductButton{top:62px}#vipButton{top:106px}}</style></head><body><iframe id="adminFrame" title="RepairMitra Admin" src="../admin-unified.html?v=20260909-9"></iframe><button id="dashboardAddProduct" type="button">➕ Add Product</button><button id="editProductButton" type="button">✏️ Edit Product</button><button id="vipButton" type="button">⭐ VIP Numbers</button><script>(function(){'use strict';var f=document.getElementById('adminFrame'),a=document.getElementById('dashboardAddProduct'),e=document.getElementById('editProductButton'),v=document.getElementById('vipButton');function visible(){try{return !!f.contentDocument.getElementById('app')}catch(x){return false}}function update(){var ok=visible();a.style.display=ok?'block':'none';e.style.display=ok?'block':'none';v.style.display=ok?'block':'none'}function run(code){try{return f.contentWindow.eval(code)}catch(x){return null}}function showEditList(){if(!visible())return;var old=f.contentDocument.getElementById('repairMitraEditPanel');if(old)old.remove();var panel=f.contentDocument.createElement('div');panel.id='repairMitraEditPanel';panel.style.cssText='position:fixed;inset:0;background:#0008;z-index:999999;display:grid;place-items:center;padding:15px';panel.innerHTML='<div style="background:#fff;width:min(620px,100%);max-height:85vh;overflow:auto;border-radius:16px;padding:18px;font-family:Arial,sans-serif"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">✏️ Edit Product</h2><button id="repairMitraEditClose" style="border:0;background:#eef2f7;border-radius:9px;padding:9px 13px">✕</button></div><p style="color:#64748b">Select a product to edit.</p><div id="repairMitraEditList">Loading products…</div></div>';f.contentDocument.body.appendChild(panel);panel.querySelector('#repairMitraEditClose').onclick=function(){panel.remove()};var data=run("sb.from('products').select('*').order('created_at',{ascending:false}).then(r=>JSON.stringify(r.data||[]))");if(data&&typeof data.then==='function')data.then(function(raw){render(raw,panel)}).catch(function(){render('[]',panel)});else render(data||'[]',panel)}function render(raw,panel){var list;try{list=JSON.parse(raw)}catch(x){list=[]}var box=panel.querySelector('#repairMitraEditList');if(!list.length){box.innerHTML='<p style="padding:15px;background:#f8fafc;border-radius:10px">No products found.</p>';return}box.innerHTML=list.map(function(p){return '<button type="button" data-id="'+String(p.id).replace(/"/g,'&quot;')+'" style="display:block;width:100%;text-align:left;margin:7px 0;padding:13px;border:1px solid #e2e8f0;border-radius:11px;background:#fff;cursor:pointer"><b>'+String(p.name||'Unnamed Product').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</b><br><small style="color:#64748b">'+String(p.category||'')+' • SKU: '+String(p.sku||'—')+' • ₹'+String(p.price||0)+'</small></button>'}).join('');box.querySelectorAll('[data-id]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-id');panel.remove();run("tab('products')");setTimeout(function(){run("openProduct("+JSON.stringify(id)+")")},150)}})}f.addEventListener('load',update);a.onclick=function(){location.href='./add-product.html'};e.onclick=showEditList;v.onclick=function(){location.href='../vip-numbers.html'};})();</script></body></html>
