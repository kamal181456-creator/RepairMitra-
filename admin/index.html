<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepairMitra Admin</title><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"></head><body><p style="font-family:Arial;text-align:center;margin-top:40px">Opening RepairMitra Admin...</p><script>(async()=>{try{const r=await fetch('../admin-unified.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Admin panel could not be loaded');let h=await r.text();const inject=`<style>.uploadBox{border:1px dashed #94a3b8;border-radius:12px;padding:12px;margin:4px 0 10px;background:#f8fafc}.uploadBox input{margin:0}.previewImg{display:none;max-width:120px;max-height:120px;border-radius:10px;object-fit:cover;margin-top:8px;border:1px solid #e2e8f0}</style><script>(function(){const ready=()=>{const pimage=document.getElementById('pimage');if(!pimage||document.getElementById('productImageUpload'))return;const box=document.createElement('div');box.className='uploadBox';box.innerHTML='<b>🖼️ Product Image</b><input id="productImageUpload" type="file" accept="image/*" capture="environment"><small class="muted">Choose from gallery or camera. Image is attached to the product automatically.</small><img id="productImagePreview" class="previewImg">';pimage.parentNode.insertBefore(box,pimage);const file=document.getElementById('productImageUpload'),preview=document.getElementById('productImagePreview');file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f)return;if(f.size>2500000){alert('Please choose an image under 2.5 MB.');file.value='';return}const rd=new FileReader();rd.onload=()=>{pimage.value=rd.result;preview.src=rd.result;preview.style.display='block'};rd.readAsDataURL(f)});};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ready);else ready();new MutationObserver(ready).observe(document.documentElement,{childList:true,subtree:true});})();<\/script>`;h=h.replace('</body>',inject+'</body>');document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<p style="font-family:Arial;text-align:center;color:#b91c1c;margin-top:40px">Unable to open Admin Panel: '+e.message+'</p>'}})();</script></body></html>
