<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<h2>🛠️ RepairMitra Admin</h2>
<p id="status">Loading Admin Control Center…</p>
<script>
(async function(){
  try {
    const r=await fetch('../admin-unified.html?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('Admin panel could not be loaded');
    let html=await r.text();
    const fix='<script src="../admin/product-management-fix.js?v=20260908-4"><\\/script><script>(function(){function boot(){var cat=document.getElementById("pc");if(!cat||document.getElementById("footwearSizesBox"))return;var box=document.createElement("div");box.id="footwearSizesBox";box.style.cssText="display:none;margin:10px 0;padding:14px;border:2px solid #2563eb;border-radius:12px;background:#eff6ff";box.innerHTML="<div style=\"font-weight:700;font-size:16px;margin-bottom:10px\">👟 Select Footwear Sizes</div><div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px\"><label><input type=\"checkbox\" value=\"5\"> 5</label><label><input type=\"checkbox\" value=\"6\"> 6</label><label><input type=\"checkbox\" value=\"7\"> 7</label><label><input type=\"checkbox\" value=\"8\"> 8</label><label><input type=\"checkbox\" value=\"9\"> 9</label><label><input type=\"checkbox\" value=\"10\"> 10</label><label><input type=\"checkbox\" value=\"11\"> 11</label><label><input type=\"checkbox\" value=\"12\"> 12</label></div><small style=\"display:block;margin-top:9px\">Select all sizes available for this product.</small>";cat.parentNode.insertBefore(box,cat.nextSibling);function sync(){var v=(cat.value||"").toLowerCase().replace(/\\s+/g,"");box.style.display=/(footwear|footware|shoes?|sandal|slipper|chappal)/.test(v)?"block":"none";}cat.addEventListener("change",sync);sync();}function retry(){boot();}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",retry);setTimeout(retry,100);setTimeout(retry,500);setTimeout(retry,1200);setTimeout(retry,2500);})();<\\/script></body>';
    html=html.replace(/<\\/body>/i,fix);
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    const s=document.getElementById('status');
    if(s) s.textContent='Unable to open Admin Panel: '+(e.message||e);
  }
})();
</script>
</body>
</html>
