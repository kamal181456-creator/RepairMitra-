<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RepairMitra Admin</title><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><style>body{font-family:Arial,sans-serif;text-align:center;padding:40px;background:#f4f7fb;color:#172033}#status{margin-top:20px;color:#64748b}</style></head><body><h2>🛠️ RepairMitra Admin</h2><p id="status">Loading Admin Control Center…</p><script>(async()=>{try{const r=await fetch('../admin-unified.html?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Admin panel could not be loaded');let h=await r.text();h=h.replace('<button class="btn" onclick="tab(\'stock\')">📈 Stock</button>','<button class="btn" onclick="tab(\'stock\')">📈 Stock</button><button class="btn success" onclick="openProduct()">➕ Add Product</button>');h=h.replace('<input id="pimage" placeholder="Image URL">','<div style="border:1px dashed #94a3b8;border-radius:12px;padding:12px;margin:5px 0 10px;background:#f8fafc;text-align:left"><b>🖼️ Product Image</b><input id="productImageUpload" type="file" accept="image/*" capture="environment" style="width:100%;margin-top:8px"><small>Camera or Gallery • Max 2.5 MB</small><img id="productImagePreview" style="display:none;max-width:140px;max-height:140px;margin-top:8px;border-radius:10px"><input id="pimage" placeholder="Image URL" style="margin-top:8px"></div>');h=h.replace('</body>','<script>(function(){function init(){var f=document.getElementById("productImageUpload"),p=document.getElementById("pimage"),im=document.getElementById("productImagePreview");if(!f||!p||f.dataset.ready)return;f.dataset.ready="1";f.onchange=function(){var file=f.files&&f.files[0];if(!file)return;if(file.size>2500000){alert("Please choose an image under 2.5 MB.");f.value="";return}var rd=new FileReader();rd.onload=function(){p.value=rd.result;im.src=rd.result;im.style.display="block"};rd.readAsDataURL(file)}}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();setTimeout(init,500);setTimeout(init,1500)})();<\\/script></body>');document.open();document.write(h);document.close()}catch(e){document.getElementById('status').textContent='Unable to open Admin Panel: '+e.message}})();</script></body></html>
