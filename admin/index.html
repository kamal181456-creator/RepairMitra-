<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>RepairMitra Admin</title>
</head>
<body>
<h2>🛠️ RepairMitra Admin</h2>
<p id="status">Loading Admin Control Center…</p>
<script>
(async function(){
  try {
    const r=await fetch('../admin-unified.html?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('Admin panel could not be loaded');
    let html=await r.text();
    const fix='<script src="../admin/product-management-fix.js?v=20260908-3"><\/script><script>(function(){function add(){var d=document.getElementById("dashboard"),a=d&&d.querySelector(".actions");if(!a||document.getElementById("mobileProductBtn"))return;var b=document.createElement("button");b.id="mobileProductBtn";b.className="btn success";b.textContent="📦 Product Management";b.onclick=function(){var n=document.querySelector("#nav button:nth-child(2)");if(typeof window.tab==="function")window.tab("products",n)};a.insertBefore(b,a.firstChild)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",function(){setTimeout(add,300)});else setTimeout(add,300);setTimeout(add,1200);})();<\/script></body>';
    html=html.replace(/<\/body>/i,fix);
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    const s=document.getElementById('status');
    if(s) s.textContent='Unable to open Admin Panel: '+(e.message||e);
  }
})();
</script>
</body>
</html>
