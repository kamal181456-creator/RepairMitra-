<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>RepairMitra Admin</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}</style>
</head>
<body>
<iframe id="adminFrame" title="RepairMitra Admin"></iframe>
<script>
const frame=document.getElementById('adminFrame');
frame.src='../admin-unified.html?v=20260908-6';
function installSizeUI(){
  const d=frame.contentDocument;
  if(!d)return;
  const cat=d.getElementById('pc');
  if(cat&&!d.getElementById('footwearSizesBox')){
    const box=d.createElement('div');
    box.id='footwearSizesBox';
    box.style.cssText='display:none;margin:10px 0;padding:14px;border:2px solid #2563eb;border-radius:12px;background:#eff6ff';
    box.innerHTML='<div style="font-weight:700;font-size:16px;margin-bottom:10px">👟 Select Footwear Sizes</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><label><input type="checkbox" value="5"> 5</label><label><input type="checkbox" value="6"> 6</label><label><input type="checkbox" value="7"> 7</label><label><input type="checkbox" value="8"> 8</label><label><input type="checkbox" value="9"> 9</label><label><input type="checkbox" value="10"> 10</label><label><input type="checkbox" value="11"> 11</label><label><input type="checkbox" value="12"> 12</label></div><small style="display:block;margin-top:9px">Select all sizes available for this product.</small>';
    cat.parentNode.insertBefore(box,cat.nextSibling);
    cat.addEventListener('change',syncSizeUI);
  }
  syncSizeUI();
  installAddProductButton();
}
function syncSizeUI(){
  const d=frame.contentDocument,cat=d&&d.getElementById('pc'),box=d&&d.getElementById('footwearSizesBox');
  if(!cat||!box)return;
  const v=(cat.value||'').toLowerCase().replace(/\s+/g,'');
  box.style.display=/(footwear|footware|shoes?|sandal|slipper|chappal)/.test(v)?'block':'none';
}
function installAddProductButton(){
  const d=frame.contentDocument;
  if(!d||!d.getElementById('app'))return;
  const app=d.getElementById('app');
  if(getComputedStyle(app).display==='none')return;
  if(d.getElementById('adminAddProductQuick'))return;
  const heads=d.querySelectorAll('.main .sectionHead');
  if(!heads.length)return;
  const head=heads[0];
  const btn=d.createElement('button');
  btn.id='adminAddProductQuick';
  btn.className='btn';
  btn.type='button';
  btn.textContent='➕ Add Product';
  btn.style.marginLeft='8px';
  btn.addEventListener('click',()=>{
    if(typeof frame.contentWindow.openProduct==='function') frame.contentWindow.openProduct();
  });
  head.appendChild(btn);
}
function install(){installSizeUI();installAddProductButton();}
frame.addEventListener('load',()=>{install();setTimeout(install,300);setTimeout(install,1000);setTimeout(install,2500);setTimeout(install,5000);});
setInterval(installAddProductButton,1000);
</script>
</body>
</html>
